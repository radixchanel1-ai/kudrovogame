<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Школьный комбат</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Pangolin&display=swap">
<style>
/* Раскладка: один экран — лист тетради в клетку. Сверху арена (canvas), снизу полоса кнопок: синий слева, красный справа. */
:root,[data-world="cell"]{
  --bg:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/var(--cell) var(--cell),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/var(--cell) var(--cell),var(--paper);
  --paper:#f4f6f1; --veil:#f4f6f1dd; --grid:#c9d8ea; --margin:#e7a3ad;
  --blue:#2038a8; --red:#cc2936; --pencil:#6b6e76; --night:#1c1e2e;
  --display:'Neucha','Pangolin','Comic Sans MS',cursive;
  --text:'Pangolin','Neucha','Comic Sans MS',cursive;
  --cell:22px; --stroke:2.5px;
  --wobble:255px 18px 225px 18px/18px 225px 18px 255px;
  --hatch:repeating-linear-gradient(-45deg,currentColor 0 2px,transparent 2px 7px);
  color-scheme:light;
}
/* Школьные миры: каждый переопределяет бумагу, чернила и фон */
[data-world="line"]{--grid:#aebfe0;--margin:#e58a98;
  --bg:repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(105deg,transparent 0 109px,var(--grid) 109px 110px),var(--paper)}
[data-world="board"]{--paper:#23423a;--veil:#23423ae6;--grid:#2d5148;--margin:#5d7a70;
  --blue:#a6d4ff;--red:#ffb5a3;--pencil:#dbe4dc;--night:#0a1410;
  --bg:radial-gradient(ellipse at 25% 35%,#ffffff14,transparent 55%),
    radial-gradient(ellipse at 75% 70%,#ffffff0d,transparent 50%),var(--paper)}
[data-world="mm"]{--paper:#fbf6ea;--veil:#fbf6eadd;--grid:#efc39a;--margin:#e39a6a;--pencil:#6f6557;
  --bg:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(#efc39a66 1px,transparent 1px) 0 0/8px 8px,
    linear-gradient(90deg,#efc39a66 1px,transparent 1px) 0 0/8px 8px,var(--paper)}
[data-world="gym"]{--paper:#ecd8b0;--veil:#ecd8b0dd;--grid:#d4b986;--margin:#fff8e8;--pencil:#5e4b32;
  --blue:#1b3aa6;--red:#b81f2b;
  --bg:repeating-linear-gradient(90deg,var(--grid) 0 2px,transparent 2px 70px),
    repeating-linear-gradient(0deg,#d4b98655 0 1px,transparent 1px 180px),var(--paper)}
*{box-sizing:border-box}
button{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body,#cover{background:var(--bg)}
body{color:var(--pencil);font-family:var(--text);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:absolute;top:0;transform-origin:0 0;display:flex;flex-direction:column;touch-action:none;isolation:isolate}
/* красные поля, как в настоящей тетради */
#stage::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;right:9%;width:2px;background:var(--margin)}
.arena{flex:1;min-height:0;position:relative}
canvas{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%}

.pads{flex:none;display:flex;justify-content:space-between;align-items:center;padding-block:4px 8px}
.pad{display:grid;gap:calc(var(--b)*.12);
  grid-template:"u u . p k" var(--b) "l r . b s" var(--b)/var(--b) var(--b) calc(var(--b)*.2) var(--b) var(--b)}
.pad[data-p="0"]{color:var(--blue)}
.pad[data-p="1"]{color:var(--red)}
.vsbot .pad[data-p="1"]{visibility:hidden}
.btn{position:relative;display:grid;place-items:center;padding:0;border:var(--stroke) solid currentColor;
  border-radius:var(--wobble);background:var(--veil);color:inherit;font:calc(var(--b)*.28)/1 var(--display);
  text-shadow:0 0 3px var(--paper),0 0 3px var(--paper);touch-action:none;transition:transform .08s}
.btn:nth-child(even){border-radius:18px 225px 18px 255px/255px 18px 225px 18px}
.btn svg{width:46%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn kbd{display:none;position:absolute;top:3px;right:7px;font:.62em var(--text);color:var(--pencil)}
.btn.on{transform:scale(.92) rotate(-2deg);background:var(--hatch),var(--veil)}
.btn.super{border-style:dashed;color:var(--pencil);font-size:calc(var(--b)*.24)}
.btn.super.ready{border-style:solid;color:inherit;animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.08) rotate(2deg)}}
#pause{width:calc(var(--b)*.62);height:calc(var(--b)*.62);border:2px solid;border-radius:var(--wobble);
  background:var(--veil);color:var(--pencil);font:calc(var(--b)*.3)/1 var(--display);padding:0}

.sheet{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:.55em;
  padding:10px 16px;background:var(--veil);text-align:center;font-size:clamp(13px,4.2vmin,19px);overflow:auto}
h1{margin:0;font:clamp(28px,12vmin,60px)/1.05 var(--display);color:var(--blue);transform:rotate(-2deg);
  text-decoration:underline wavy var(--red) 2px;text-underline-offset:.14em;text-wrap:balance}
h2{margin:0;font:clamp(20px,7.5vmin,34px)/1 var(--display)}
.grade{display:inline-grid;place-items:center;width:1.3em;height:1.3em;margin-left:.25em;
  border:3px solid var(--red);border-radius:50%;color:var(--red);transform:rotate(9deg)}
.sheet p{margin:0;max-width:36em}
.keys{display:none;grid-template-columns:auto auto;gap:.1em 1.6em;text-align:left;font-size:.8em}
.keys :first-child{color:var(--blue)}
.keys :last-child{color:var(--red)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1.4em}
/* меню полупрозрачное: за ним идёт показательный бой ботов */
#menu{background:color-mix(in srgb,var(--paper) 72%,transparent);text-shadow:0 0 4px var(--paper),0 0 2px var(--paper)}
.stamp{padding:.05em .55em;border:2px solid var(--red);border-radius:4px;color:var(--red);font:.8em var(--display);
  transform:rotate(-5deg);text-shadow:none;background:var(--paper)}
#toast{position:absolute;z-index:5;bottom:calc(var(--b)*2.3 + 26px);left:50%;padding:.2em .9em;border:2px solid var(--red);border-radius:var(--wobble);
  background:var(--paper);color:var(--red);font:clamp(14px,4vmin,19px) var(--display);pointer-events:none;opacity:0;white-space:nowrap}
#toast.show{animation:toast 2.8s}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}8%,85%{opacity:1;transform:translate(-50%,0) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-12px)}}
.ladder{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.step{position:relative;display:grid;justify-items:center;width:7.2em;padding:2px 4px 4px;border:2px solid;border-radius:var(--wobble);
  font:1em/1.1 var(--display);color:var(--pencil);background:var(--paper)}
.step canvas{height:min(52px,13vmin);aspect-ratio:54/62}
.step small{font:.6em/1.15 var(--text)}
.step.now{color:var(--red);box-shadow:4px 4px 0 currentColor}
.step.done::after{content:"✓";position:absolute;top:-.15em;right:.1em;color:var(--red);font:2.4em/1 var(--display);transform:rotate(-8deg)}
.diary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.25em 1.6em;max-width:44em;text-align:left;font-size:.9em}
.diary .got{color:var(--red)}
.go{padding:.2em 1.1em;border:var(--stroke) solid;border-radius:var(--wobble);background:var(--paper);
  color:var(--red);font:1.6em var(--display);cursor:pointer}
.go small{display:block;font:.45em/1.2 var(--text);color:var(--pencil)}
.world{background:var(--bg);color:var(--blue);border-color:var(--pencil);font-size:1.3em;padding:.3em .8em;max-width:11em}
.go.picked{box-shadow:4px 4px 0 currentColor}
.go:hover,.card:hover:enabled{background:var(--hatch),var(--paper)}
.go:active,.card:active{transform:scale(.95)}
.quiet{border:0;background:none;color:var(--pencil);font:inherit;text-decoration:underline dotted;cursor:pointer}
:focus-visible{outline:2px dashed var(--pencil);outline-offset:3px}
#pGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:min(100%,760px)}
.card{display:grid;justify-items:center;align-content:start;min-width:0;padding:2px 4px 4px;border:2px solid;
  border-radius:var(--wobble);background:var(--paper);color:inherit;font:1.05em/1.1 var(--display);cursor:pointer;
  text-shadow:0 0 3px var(--paper)}
.card:nth-child(even){border-radius:18px 225px 18px 255px/255px 18px 225px 18px}
.card canvas{height:min(54px,13vmin);aspect-ratio:54/62}
.card small{font:.55em/1.1 var(--text);color:var(--pencil)}
.card:disabled{opacity:.5;cursor:default}
#cover{cursor:pointer;color:var(--blue);font-family:var(--display)}
#cover b{font-size:2em;font-weight:400}
#cover small{color:var(--pencil);font-family:var(--text)}
@media (hover:hover) and (pointer:fine){.btn kbd{display:block}.keys{display:grid}}
@media (prefers-reduced-motion:reduce){.btn.super.ready{animation:none}}
</style>

<div id="app"><div id="stage">
  <div class="arena"><canvas id="cv"></canvas></div>
  <div class="pads">
    <div class="pad" data-p="0"></div>
    <button id="pause" tabindex="-1" aria-label="Пауза">II</button>
    <div class="pad" data-p="1"></div>
  </div>
  <div id="menu" class="sheet">
    <h1 id="mTitle">Школьный комбат</h1>
    <span id="mStamp" class="stamp">издание второе, исправленное</span>
    <p id="mText"></p>
    <div class="keys">
      <span>Синий: A D ходить · W прыжок · S блок<br>F удар · G нога · T суперсила</span>
      <span>Красный: ← → ходить · ↑ прыжок · ↓ блок<br>K удар · L нога · O суперсила</span>
    </div>
    <div class="row" id="mMain">
      <button id="mFriend" class="go" autofocus>Вдвоём<small>на одном экране</small></button>
      <button id="mBot" class="go">Против бота<small>три уровня</small></button>
      <button id="mTour" class="go">Четверть<small>5 боёв, в конце Директор</small></button>
    </div>
    <div class="row" id="mLevels" hidden></div>
    <div class="row">
      <button id="mBack" class="quiet" hidden>← Назад</button>
      <button id="mAgain" class="quiet" hidden>Реванш теми же бойцами</button>
      <button id="mDiary" class="quiet">Дневник</button>
      <button id="mSound" class="quiet">Звук: выкл</button>
    </div>
  </div>
  <div id="pick" class="sheet" hidden>
    <h2 id="pTitle"></h2>
    <div id="pGrid"></div>
    <div id="wGrid" class="row" hidden></div>
    <button id="pBack" class="quiet">← Назад</button>
  </div>
  <div id="ladder" class="sheet" hidden>
    <h2 id="lTitle"></h2>
    <p id="lText"></p>
    <div id="lSteps" class="ladder"></div>
    <button id="lGo" class="go">В бой!</button>
    <button id="lQuit" class="quiet">Бросить четверть</button>
  </div>
  <div id="diary" class="sheet" hidden>
    <h2>Дневник достижений</h2>
    <div id="dList" class="diary"></div>
    <button id="dBack" class="quiet">← Назад</button>
  </div>
  <div id="toast"></div>
  <div id="cover" class="sheet" hidden>
    <span id="cDate"></span>
    <b>Классная работа</b>
    <small>Пауза. Нажми в любом месте, чтобы вернуться в бой.</small>
  </div>
</div></div>

<script>
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.random()*a.length|0];
const rootCss=getComputedStyle(document.documentElement);
const THEME=Object.fromEntries(['paper','blue','red','pencil','margin','night'].map(k=>[k,rootCss.getPropertyValue('--'+k).trim()]));
const FONT="Neucha, Pangolin, 'Comic Sans MS', cursive";
const INK=[THEME.blue,THEME.red], NAME=['Синий','Красный'], DATIVE=['Синему','Красному'];
const SPEED=190, JUMP=520, GRAV=1500, TALL=112;

// Бойцы: speed — скорость, power — сила удара, tough — множитель получаемого урона (меньше = крепче),
// kind — суперсила, range — на каком расстоянии бот её применяет
const CHARS=[
  {id:'vihr',name:'Вихрь',tag:'обычный пацан, кидает кляксы',sp:'Клякса',speed:1,power:1,tough:1,jump:1,size:1,kind:'blot',range:[170,900]},
  {id:'ninja',name:'Ниндзя',tag:'быстрый, телепорт за спину',sp:'Тень',speed:1.25,power:.95,tough:1.05,jump:1.1,size:.95,kind:'blink',range:[70,900]},
  {id:'bugai',name:'Бугай',tag:'медленный танк, топает волной',sp:'Топот',speed:.78,power:1.12,tough:.98,jump:.85,size:1.18,thick:1.6,kind:'stomp',range:[0,230]},
  {id:'botan',name:'Ботаник',tag:'хилый, зато самолётики быстрые',sp:'Самолёт',speed:1.05,power:1,tough:1,jump:1,size:.95,kind:'plane',range:[150,900]},
  {id:'robot',name:'Робот',tag:'лазер через весь лист',sp:'Лазер',speed:.9,power:1.05,tough:.95,jump:.9,size:1.05,kind:'laser',range:[120,900]},
  {id:'cat',name:'Кот',tag:'двойной прыжок и бросок с когтями',sp:'Когти',speed:1.25,power:1.05,tough:.92,jump:1.1,size:.85,jumps:2,kind:'pounce',range:[90,230]},
  {id:'mag',name:'Маг',tag:'молния с неба, не стой на месте',sp:'Молния',speed:1.02,power:1.1,tough:.97,jump:1,size:1,kind:'bolt',range:[120,900]},
  {id:'pirat',name:'Пират',tag:'бросает бомбы навесом',sp:'Бомба',speed:1,power:1.05,tough:1,jump:.95,size:1.02,kind:'bomb',range:[140,340]},
  {id:'otl',name:'Отличник',tag:'щит-пятёрка: 4 секунды неуязвим',sp:'Пятёрка',speed:1,power:.95,tough:1,jump:1,size:.97,kind:'shield',range:[0,150]},
  {id:'povar',name:'Повар',tag:'котлета скачет по полу',sp:'Котлета',speed:.95,power:1.05,tough:.95,jump:.95,size:1.08,kind:'cutlet',range:[120,420]},
  {id:'scrib',name:'Каракуля',tag:'каждый раз новая суперсила',sp:'Хаос',lock:'scrib',hint:'победи бота-босса, чтобы открыть',fem:true,speed:1.1,power:1,tough:.95,jump:1.1,size:1.05,kind:'random',range:[100,330]},
  {id:'dir',name:'Директор',tag:'вызывает к доске прямо к себе',sp:'К доске',lock:'dir',hint:'пройди Четверть, чтобы открыть',
    speed:.85,power:1.05,tough:.93,jump:.9,size:1.22,thick:1.3,kind:'summon',range:[90,400]},
];
// Миры: notes — надписи на фоне; особенность задаётся множителями jump / ev (частота событий) / gain (чернила) / dmg
const WORLDS=[
  {id:'cell',name:'Тетрадь в клетку',tag:'классика, без сюрпризов',notes:['д/з: № 214, 217','2x + 5 = 17']},
  {id:'line',name:'Тетрадь в линейку',tag:'события случаются вдвое чаще',ev:.5,notes:['Жи-ши пиши с «и»','Классная работа']},
  {id:'board',name:'Школьная доска',tag:'мел крошится: суперсила копится быстрее',gain:1.6,notes:['E = mc²','Дежурный: Петров']},
  {id:'mm',name:'Миллиметровка',tag:'точный расчёт: удары больнее',dmg:1.25,notes:['Чертёж № 3','М 1:10']},
  {id:'gym',name:'Спортзал',tag:'пол пружинит: прыжки выше',jump:1.3,court:true,notes:['Физра: 3 круга','Счёт 2:1']},
];
let world=WORLDS[0];
function setWorld(i){
  world=WORLDS[i]; document.documentElement.dataset.world=world.id;
  for(const k in THEME) THEME[k]=rootCss.getPropertyValue('--'+k).trim();
  INK[0]=THEME.blue; INK[1]=THEME.red;
}
const KINDS=['blot','blink','stomp','plane','laser','pounce','bolt','bomb','shield','cutlet','summon'];

// Бот видит то же, что игрок, и «нажимает» те же кнопки. Уровни отличаются скоростью реакции,
// частотой решений, числом ошибок и напором; skill — как часто ловит на ошибках, idle — как часто зевает.
const LEVELS=[
  {name:'лёгкий',note:'для разминки',react:.36,think:.36,miss:.58,aggro:.2,guard:.1,skill:.3,idle:.25},
  {name:'умный',note:'блокирует и наказывает',react:.19,think:.18,miss:.4,aggro:.33,guard:.22,skill:.5,idle:.18},
  {name:'босс',note:'ошибается редко',react:.15,think:.15,miss:.33,aggro:.38,guard:.26,skill:.65,idle:.14},
];
let vsBot=false, botLv=1, lastSetup=null;
const unlocks=new Set(), got=new Set();   // открытые бойцы и полученные достижения
try{
  const v=localStorage.getItem('botLv'); if(v!==null&&LEVELS[+v]) botLv=+v;
  if(localStorage.getItem('scrib')==='1') unlocks.add('scrib');
  JSON.parse(localStorage.getItem('unlocks')||'[]').forEach(u=>unlocks.add(u));
  JSON.parse(localStorage.getItem('got')||'[]').forEach(a=>got.add(a));
}catch{}
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const isOpen=c=>!c.lock||unlocks.has(c.lock);
function unlock(u){if(unlocks.has(u)) return false; unlocks.add(u); save('unlocks',JSON.stringify([...unlocks])); return true;}
const brains=[{t:0,held:{}},{t:0,held:{}}];

// Удары: замах, активная фаза, откат (сек), урон, дальность, высота удара, отброс, оглушение, прирост чернил
const ATK={
  punch:{wind:.07,act:.09,rec:.13,dmg:6,reach:70,h:-80,push:150,stun:.22,gain:14,words:['ТЫЦ','БАЦ','ШЛЁП']},
  kick:{wind:.16,act:.1,rec:.24,dmg:12,reach:86,h:-50,push:270,stun:.38,gain:22,words:['ХРЯСЬ','БУМ','ДЫЩ']},
  throw:{wind:.12,act:.05,rec:.3,dmg:9,reach:50,h:-60,push:0,stun:.6,gain:18,unblock:true,toss:true,words:['БРОСОК','ОПА']},
  pounce:{wind:.2,act:.14,rec:.2,dmg:19,reach:72,h:-45,push:300,stun:.5,gain:0,words:['ЦАП','МЯУ']},
  cast:{wind:.2,act:.05,rec:.3},
};
// Попадания суперсил и событий
const SPEC={
  blot:{dmg:21,h:-55,push:300,stun:.45,gain:0,words:['ШМЯК','ПЛЮХ']},
  plane:{dmg:17,h:-60,push:200,stun:.35,gain:0,words:['ВЖУХ','ТЫК']},
  bomb:{dmg:20,h:-40,push:340,stun:.5,gain:0,words:['БАБАХ','БДЫЩ']},
  laser:{dmg:16,h:-70,push:240,stun:.4,gain:0,words:['ПИУ','ВЖЖЖ']},
  cutlet:{dmg:17,h:-40,push:220,stun:.4,gain:0,words:['ЧВЯК','КОТЛЕТА']},
  summon:{dmg:10,h:-60,push:0,stun:.8,gain:0,unblock:true,words:['К ДОСКЕ','ВЫЗОВ']},
  deuce:{dmg:8,h:-90,push:140,stun:.3,gain:0,unblock:true,words:['ДВОЙКА','НЕ ВЕРТИСЬ']},
  bolt:{dmg:27,h:-80,push:120,stun:.6,gain:0,unblock:true,words:['ТРРАХ','ШАРАХ']},
  wave:{dmg:15,h:-10,push:260,stun:.45,gain:0,words:['ТУДУХ','БУХ']},
  eraser:{dmg:10,h:-15,push:320,stun:.4,gain:0,unblock:true,words:['ШОРК','ВЖИК']},
};

// Поза — точки относительно стоп, боец смотрит вправо:
// голова, шея, таз, локоть П/З, кисть П/З, колено П/З, стопа П/З (П — передняя, З — задняя)
const pose=s=>s.split(' ').map(p=>p.split(',').map(Number));
const POSES={
  idle: pose('4,-98 2,-86 0,-48 14,-68 -8,-66 24,-82 8,-78 12,-25 -10,-24 16,0 -14,0'),

let shots=[], items=[], drops=[], words=[], pending=[];

// ---------- управление ----------
const KEYMAP={}, BTN=[{},{}];
document.querySelectorAll('.pad').forEach((pad,p)=>{
  for(const [a,[label,...codes]] of Object.entries(ACTIONS)){
    const b=document.createElement('button');
    b.className='btn'+(a==='s'?' super':''); b.style.gridArea=a; b.tabIndex=-1;
    b.setAttribute('aria-label',`${NAME[p]}: ${({u:'прыжок',l:'влево',r:'вправо',s:'суперсила'})[a]??label}`);
    b.innerHTML=(ARROWS[label]?`<svg viewBox="0 0 24 24"><path d="${ARROWS[label]}"/></svg>`:`<span>${label}</span>`)+`<kbd>${keyLabel(codes[p])}</kbd>`;
    b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(p,a,true);};
    b.onpointerup=b.onpointercancel=()=>press(p,a,false);
    pad.append(b); BTN[p][a]=b; KEYMAP[codes[p]]=[p,a];
  }
});
function press(p,a,down){
  const f=F[p];
  f.keys[a]=down; BTN[p][a].classList.toggle('on',down);
  if(!down) return;
  f.buf[a]=.15;                                   // нажатие «помнится» 0.15 с, чтобы удар не терялся
  if(a==='l'||a==='r'){                            // двойное нажатие вбок — рывок
    const now=performance.now();
    if(now-(f.tap[a]||0)<270) f.buf['d'+a]=.15;
    f.tap[a]=now;
  }
}
const keyFor=c=>KEYMAP[c]&&(vsBot?[0,KEYMAP[c][1]]:KEYMAP[c]);
const releaseAll=()=>[0,1].forEach(p=>Object.keys(ACTIONS).forEach(a=>press(p,a,false)));
addEventListener('keydown',e=>{
  if(e.code==='Escape'||e.code==='KeyP') return togglePause();
  const m=keyFor(e.code); if(!m||G.mode==='menu'||G.demo) return;
  e.preventDefault(); if(!e.repeat) press(...m,true);
});
addEventListener('keyup',e=>{const m=keyFor(e.code); if(m) press(...m,false);});

// ---------- звук (по умолчанию выключен: урок же) ----------
let ac=null, soundOn=false;
function beep(freq,dur,type='square'){
  if(!soundOn||G.demo) return;
  ac??=new AudioContext();
  const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq/3,t+dur);
  g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(t+dur);
}
$('#mSound').onclick=e=>{soundOn=!soundOn; e.target.textContent='Звук: '+(soundOn?'вкл':'выкл'); beep(300,.1);};

const say=(text,color)=>G.banner={text,color,t:0};
function note(text){G.note={text,t:0};}
const JOKES=['Учитель вышел из класса','Кто списывал — шаг вперёд','Сменка где?','Не бегать по коридору!','Последняя парта, потише!','Кто проиграет — моет доску','Только не по тетради!',
  'Дневники на стол','Контрольная отменяется','Звонок для учителя'];
function setupMatch(withBot,chars,wi){

  vsBot=withBot; stage.classList.toggle('vsbot',vsBot);
  NAME[1]=vsBot?'Бот':'Красный'; DATIVE[1]=vsBot?'Боту':'Красному';

  F.forEach((f,i)=>{f.energy=0; f.c=CHARS[chars[i]]; BTN[i].s.firstChild.textContent=f.c.sp;});

}

// показательный бой двух ботов за меню
function startDemo(){
  const pool=available();
  setupMatch(false,[pick(pool),pick(pool)],Math.random()*WORLDS.length|0); G.demo=true;
}
function startRound(){
  F.forEach((f,i)=>Object.assign(f,{x:W*(i?.7:.3),y:0,vx:0,vy:0,kb:0,face:i?-1:1,hp:100,hpShow:100,state:'idle',t:0,
    combo:0,comboT:0,dashCd:0,inv:0,fast:0,boost:1,spin:0,shield:0,caught:0,buf:{}}));
  brains.forEach(b=>b.t=.3); releaseAll();
  shots=[]; items=[]; G.ev=null; G.evT=(7+Math.random()*5)*(world.ev||1);
  G.mode='intro'; G.t=0; G.time=60; G.winner=-1; G.finish=null;
  say('Раунд '+G.round,THEME.pencil); note(pick(JOKES));
}
function endRound(w,text){
  if(G.mode!=='fight') return;
  G.mode='over'; G.t=0; G.winner=w; G.ev=null;
  if(w>=0) G.wins[w]++;
  say(w<0?'Ничья!':text,THEME.red);
  // решающий нокаут — можно сделать добивание
  G.finish=w>=0&&G.wins[w]===2&&text==='Нокаут!'?{stage:'offer',t:0,w}:null;
}
function updateFinish(fin,dt){
  fin.t+=dt;
  const w=F[fin.w], auto=G.demo||(vsBot&&fin.w===1);
  if(fin.stage==='offer'){
    if(w.buf.s>0||(auto&&fin.t>.9)){
      Object.assign(fin,{stage:'play',t:0,type:pick(['trash','erase','plane'])});
      w.buf.s=0; setState(w,'kick'); G.shake=12; beep(200,.4,'sawtooth'); achieve('fin',fin.w);
    }else if(fin.t>2.4){G.finish=null; G.t=2.6;}
  }else{
    if(fin.type==='erase'&&fin.t<1.4&&Math.random()<.5) puff(F[1-fin.w].x+(Math.random()-.5)*50,GY-30-Math.random()*70);
    if(fin.t>2.7){G.finish=null; G.t=2.6;}
  }
}
function nextRound(){
  const w=G.winner;
  if(w<0||G.wins[w]<2){G.round++; return startRound();}
  if(G.demo) return startDemo();
  releaseAll();
  if(!vsBot||w===0) achieve('win');
  if(T.on) return tourResult(w===0);
  const c=F[w].c, next=vsBot&&w===0&&LEVELS[botLv+1];
  let extra=next?` Теперь попробуй бота «${next.name}».`:'';

    achieve('boss');

  }

}

const T={on:false,step:0,me:0,foes:[],lv0:1};

function startTour(me){
  const pool=available().filter(i=>i!==me&&CHARS[i].id!=='dir'), foes=[];
  while(foes.length<4){const i=pick(pool); if(!foes.includes(i)) foes.push(i);}
  Object.assign(T,{on:true,step:0,me,foes:[...foes,CHARS.findIndex(c=>c.id==='dir')],lv0:botLv});
  showLadder('Четверть началась','Пять уроков, пять соперников, каждый следующий сильнее. В конце тебя ждёт кое-кто особенный.','В бой!');
}
function showLadder(title,text,go){
  document.querySelectorAll('.sheet').forEach(el=>el.hidden=true);
  $('#ladder').hidden=false; $('#lTitle').textContent=title; $('#lText').textContent=text; $('#lGo').textContent=go;
  $('#lSteps').innerHTML='';
  T.foes.forEach((fi,n)=>{
    const secret=n===4&&T.step<4, d=document.createElement('div');
    d.className='step'+(n<T.step?' done':n===T.step?' now':'');
    d.innerHTML=`<canvas width="108" height="124"></canvas><span>${secret?'???':CHARS[fi].name}</span><small>${WORLDS[TOUR_WORLD[n]].name}<br>бот ${LEVELS[TOUR_LV[n]].name}</small>`;
    $('#lSteps').append(d); portrait(d.firstChild,secret?null:CHARS[fi],1);
  });

}
function tourResult(won){
  if(won) T.step++;

  if(T.step===5){
    T.on=false; botLv=T.lv0; achieve('tour');
    const fresh=unlock('dir');
    resetMenu();
    showResult('Отличник четверти!',0,'Все пять уроков пройдены, Директор повержен.'+(fresh?' Теперь Директор открыт как боец.':''));
    return;
  }
  const f=T.foes[T.step];
  showLadder(won?`Урок ${T.step} пройден!`:'Двойка за урок',
    T.step===4?'Последний урок. Тебя вызывает Директор!':won?`Дальше: ${CHARS[f].name}, ${WORLDS[TOUR_WORLD[T.step]].name.toLowerCase()}.`:'Не беда, попробуй этот урок ещё раз.',
    won?'Следующий урок':'Ещё раз');
}

// ---------- бойцы ----------
function setState(f,s){f.state=s; f.t=0; f.done=false;}
const inBody=(y,o)=>y<o.y+6&&y>o.y-TALL;

function strike(f,o,a){
  const dx=(o.x-f.x)*f.face, mult=f.boost; f.boost=1;
  if(a.toss&&o.y<-10) return;
  if(dx>-12&&dx<a.reach&&inBody(f.y+a.h,o)) pending.push(()=>hit(o,f.face,a,f,mult));
}
// att — кто ударил (null у событий вроде ластика)
function hit(v,dir,a,att,mult=1){
  if(v.state==='ko'||G.mode!=='fight'||v.inv>0) return;
  if(v.shield>0){word('Пятёрка!',v.x,GY+v.y-95,INK[v.i]); v.kb=dir*120; beep(900,.06,'triangle'); return;}
  const melee='wind' in a, heavy=a.dmg>8;
  const blocked=!a.unblock&&v.state==='block'&&v.face===-dir;
  const hx=v.x-dir*14, hy=GY+v.y+a.h;
  if(blocked&&v.t<.12){                            // блок в последний момент — парирование
    word('Парировал!',hx,hy-22,INK[v.i]); achieve('parry',v.i); v.energy=Math.min(100,v.energy+15); G.stop=.08; beep(700,.1,'triangle');
    if(melee&&att){att.stun=.55; att.kb=-dir*220; att.combo=0; setState(att,'hit');}
    return;
  }
  let dmg=a.dmg*mult*v.c.tough*(world.dmg||1);
  if(att) dmg*=att.c.power*(att.hp<=25?1.3:1);     // при здоровье ниже четверти боец в ярости бьёт сильнее
  if(blocked) dmg*=.15;
  else if(att){
    att.combo=att.comboT>0?att.combo+1:1; att.comboT=1.3;
    dmg*=1+Math.min(4,att.combo-1)*.12;
    if(att.combo>=3) word('комбо ×'+att.combo,hx,hy-50,THEME.red);
    if(att.combo>=5) achieve('combo',att.i);
  }
  v.hp=Math.max(0,v.hp-Math.ceil(dmg));
  v.kb=dir*a.push*(blocked?.4:1);
  if(blocked){word('Блок',hx,hy,THEME.pencil); G.stop=.03; beep(180,.05);}
  else{
    v.vx=0; v.stun=a.stun; v.combo=0; setState(v,'hit');
    v.energy=Math.min(100,v.energy+8);
    if(att) att.energy=Math.min(100,att.energy+a.gain*(world.gain||1));
    if(a.toss){v.vy=-430; v.kb=-dir*700;}         // бросок: соперник летит через бросающего
    G.stop=heavy?.09:.05; G.shake=heavy?9:5; G.cheer=1;
    word(pick(a.words)+'!',hx,hy-22,att?INK[att.i]:THEME.pencil); splash(hx,hy,dir,INK[v.i],a.dmg);
    beep(heavy?90:140,.12,'sawtooth');
  }
  if(v.hp<=0){
    setState(v,'ko'); v.vx=0; v.vy=-480; v.kb=dir*520; v.spin=0; v.spinV=dir*10;   // нокаут: улетает кувырком
    G.slow=.9; G.shake=14;
    endRound(att?att.i:1-v.i,'Нокаут!');
  }
}
// суперсила, когда чернила полные
function special(f,o){
  const kind=f.c.kind==='random'?pick(KINDS):f.c.kind, d=f.face, i=f.i;
  beep(520,.2,'triangle');
  if(kind==='blot') shots.push({kind,i,x:f.x+d*50,y:f.y-58,vx:d*430});
  if(kind==='plane') shots.push({kind,i,x:f.x+d*50,y:f.y-62,y0:f.y-62,vx:d*600});
  if(kind==='bomb') shots.push({kind,i,x:f.x+d*30,y:f.y-80,vx:d*clamp(Math.abs(o.x-f.x)-30,110,360)/.99,vy:-430});
  if(kind==='bolt') shots.push({kind,i,x:o.x});
  if(kind==='stomp'){G.shake=10; for(const s of [-1,1]) shots.push({kind:'wave',i,x:f.x,vx:s*380});}
  if(kind==='laser'){
    shots.push({kind,i,x:f.x,y:f.y-70,dir:d});
    if((o.x-f.x)*d>0&&inBody(f.y-70,o)) hit(o,d,SPEC.laser,f);
  }
  if(kind==='blink'){                              // исчезнуть и ударить из-за спины
    puff(f.x,GY+f.y-50);
    const side=Math.sign(o.x-f.x)||1, nx=o.x+side*46;
    f.x=nx>24&&nx<W-24?nx:o.x-side*46; f.face=o.x>=f.x?1:-1;
    puff(f.x,GY+f.y-50); f.boost=2.4; setState(f,'punch');
  }
  if(kind==='pounce'){f.vy=-380; f.vx=d*430; setState(f,'pounce');}
  if(kind==='shield'){f.shield=4; f.hp=Math.min(100,f.hp+10); word('Пятёрка!',f.x,GY+f.y-110,INK[i]);}
  if(kind==='cutlet') shots.push({kind,i,x:f.x+d*40,y:f.y-70,vx:d*300,vy:-260});
  if(kind==='summon'){                              // вызов к доске: притянуть соперника к себе
    const dist=Math.abs(o.x-f.x);
    shots.push({kind:'chalk',i,x:f.x+d*20,x2:o.x,y:f.y-70});
    if(dist<420){hit(o,d,SPEC.summon,f); if(o.state==='hit') o.kb=-d*Math.max(0,dist-50)*7;}

}
function updateFighter(f,o,dt,live){
  const c=f.c;
  f.t+=dt; f.comboT-=dt; f.dashCd-=dt; f.inv-=dt; f.fast-=dt; f.shield-=dt;
  for(const a in f.buf) f.buf[a]-=dt;
  const k=live?f.keys:{}, want=a=>live&&f.buf[a]>0&&!(f.buf[a]=0);
  const ground=f.y>=0&&f.vy>=0, a=ATK[f.state];
  if(ground) f.jumps=c.jumps||1;
  if(a){
    if(!f.done&&f.t>=a.wind){
      f.done=true;
      if(f.state==='cast') special(f,o); else strike(f,o,a);
    }
    if(ATK[f.state]===a&&f.t>=a.wind+a.act+a.rec) setState(f,'idle');
  }
  else if(f.state==='hit'){if(f.t>=f.stun) setState(f,'idle');}
  else if(f.state==='block'){
    if(want('p')) setState(f,'throw');             // Блок + Удар — бросок, пробивает блок
    else if(!k.b) setState(f,'idle');
  }

  if(f.state==='idle'||f.state==='block') f.face=o.x>=f.x?1:-1;
  if(f.state==='idle'){
    const dir=(k.r?1:0)-(k.l?1:0), dash=want('dl')?-1:want('dr')?1:0;
    f.vx=dir*SPEED*c.speed*(f.fast>0?1.45:1); f.moving=dir!==0;
    if(dash&&f.dashCd<=0){f.kb=dash*620; f.dashCd=.55; f.inv=.16; puff(f.x,GY+f.y-12);}   // рывок: на миг неуязвим
    if(want('s')&&f.energy>=100){f.energy=0; setState(f,'cast');}
    else if(want('p')) setState(f,k.b&&ground?'throw':'punch');
    else if(want('k')) setState(f,'kick');
    else if(want('u')&&f.jumps>0){f.vy=-JUMP*c.jump*(world.jump||1); f.jumps--; if(!ground) puff(f.x,GY+f.y);}
    else if(ground&&k.b) setState(f,'block');
  }
  if(f.state!=='idle'&&f.y>=0&&f.vy>=0) f.vx=0;
  f.vy+=GRAV*(G.ev?.type==='moon'?.35:1)*dt; f.y+=f.vy*dt;
  if(f.y>=0){f.y=0; f.vy=0;}
  if(f.state==='ko') f.spin=f.y<0?f.spin+f.spinV*dt:0;
  f.kb*=Math.exp(-7*dt);
  const nx=f.x+(f.vx+f.kb)*dt;
  if((nx<24||nx>W-24)&&f.state==='hit'&&Math.abs(f.kb)>200){   // отлетел в стену — отскок
    f.kb*=-.55; f.vy=Math.min(f.vy,-220); f.stun+=.15; G.shake=7;
    word('ОТ СТЕНЫ!',f.x,GY+f.y-80,THEME.pencil); puff(f.x,GY+f.y-40); achieve('wall',1-f.i);
  }
  f.x=clamp(nx,24,W-24);
}
const poseName=f=>f.state!=='idle'?f.state:f.y<0?'jump':f.moving?(Math.floor(G.clock*9)%2?'walkA':'walkB'):'idle';

// ---------- бот ----------
function botUpdate(p,dt){
  const me=F[p], o=F[1-p], B=brains[p], L=LEVELS[botLv];
  const hold=h=>{['l','r','b'].forEach(a=>{if(!h[a]!==!B.held[a]) press(p,a,!!h[a]);}); B.held=h;};
  if(G.mode!=='fight') return hold({});
  if((B.t-=dt)>0) return;
  B.t=L.think*(.6+Math.random()*.8);
  if(G.ev?.type==='teacher'&&G.ev.t<3.25&&Math.random()>L.miss*.4) return hold({});   // учитель смотрит — замереть

  const chance=x=>Math.random()<x, tap=a=>me.buf[a]=.15, sharp=!chance(L.miss), skilled=chance(L.skill);
  if(chance(L.idle)) return hold({});                        // зевнул: стоит и ничего не делает
  const dx=o.x-me.x, dist=Math.abs(dx), fwd=dx>0?'r':'l', back=dx>0?'l':'r', ground=me.y>=0;
  const oa=ATK[o.state], left=oa?oa.wind+oa.act+oa.rec-o.t:0;
  const inFront=o.face*(me.x-o.x)>0;
  const threat=oa&&!o.done&&o.t>=L.react&&(o.state==='cast'?o.c.kind==='laser'&&inFront:o.face*(me.x-o.x)<oa.reach+30);
  const foe=s=>s.i!==p, coming=s=>Math.sign(me.x-s.x)===Math.sign(s.vx), near=(s,r)=>Math.abs(s.x-me.x)<r;
  const shot=shots.find(s=>['blot','plane','bomb','cutlet'].includes(s.kind)&&foe(s)&&coming(s)&&near(s,200));
  const low=shots.find(s=>(s.kind==='eraser'||s.kind==='wave')&&foe(s)&&coming(s)&&near(s,100));
  const bolt=shots.find(s=>s.kind==='bolt'&&foe(s)&&!s.done&&near(s,44));
  const gift=items.find(g=>Math.abs(g.x-me.x)<Math.abs(g.x-o.x)+60);
  const aggro=L.aggro+(me.hp<o.hp?.15:0), cornered=me.x<70||me.x>W-70, r=me.c.range;
  const h={};

  if(bolt&&sharp){                                           // под ногами метка молнии — уйти
    let away=me.x>=bolt.x?'r':'l';
    if((away==='r'&&me.x>W-70)||(away==='l'&&me.x<70)) away=away==='r'?'l':'r';
    h[away]=true; if(chance(.5)) tap('d'+away);
  }
  else if(low&&sharp){if(ground) tap('u');}                  // ластик или волна по земле — прыжок
  else if(shot&&sharp){                                      // летит снаряд: перепрыгнуть или закрыться
    const bd=Math.abs(shot.x-me.x);
    if(shot.kind==='blot'&&ground&&bd>90&&bd<150&&chance(.5)) tap('u'); else h.b=true;
  }
  else if(o.shield>.3&&sharp&&!cornered) h[back]=true;      // у соперника щит — переждать
  else if(threat&&sharp&&ground){                            // соперник замахнулся — блок или рывок назад
    if(o.state!=='cast'&&!cornered&&chance(aggro*.25)) tap('d'+back); else h.b=true;
  }
  else if(skilled&&oa&&o.done&&left>.12&&dist<ATK.punch.reach-4) tap(dist>55&&left>.22?'k':'p'); // наказать за промах
  else if(skilled&&o.state==='hit'&&dist<ATK.kick.reach-4) tap(dist>56?'k':'p');                // добить, пока оглушён
  else if(skilled&&o.y<-25&&o.vy>0&&dist<70&&sharp) tap('p');         // сбить в прыжке
  else if(me.y<0&&dist<80) tap('k');                         // удар ногой с прыжка
  else if(me.energy>=100&&o.y>=0&&dist>=r[0]&&dist<=r[1]) tap('s');
  else if(cornered&&dist<60&&chance(.35)){h[fwd]=true; tap('u');}                      // выпрыгнуть из угла
  else if(dist>82){
    if(gift){if(Math.abs(gift.x-me.x)>14) h[gift.x>me.x?'r':'l']=true;}                 // сбегать за бонусом
    else{
      if(dist>130&&dist<220&&chance(.12*aggro)) tap('u');    // запрыгнуть сверху
      h[fwd]=true;
    }
  }
  else if(o.state==='block'){                                // в блок не долбить: бросок или отойти
    if(dist<48&&ground&&chance(.6)){h.b=true; tap('p');}
    else if(chance(.5)) h[fwd]=true;
    else if(!cornered) h[back]=true;
  }
  else if(chance(aggro)) tap(dist>60?'k':'p');
  else if(chance(L.guard)) h.b=true;                         // ждать удар под блоком
  else if(!cornered) h[back]=true;                           // отойти и выманить на промах
  hold(h);
}

// ---------- события на листе ----------
const EVENTS={
  eraser(){const left=Math.random()<.5; shots.push({kind:'eraser',x:left?-50:W+50,vx:left?330:-330,hit:[0,0]}); return 'Берегись, ластик!';},
  gift(){items.push({type:pick(['heal','ink','fast']),x:70+Math.random()*(W-140),y:-H,life:9}); return 'Что-то падает с неба';},
  moon(){G.ev={type:'moon',t:7}; return 'Невесомость!';},
  bell(){G.ev={type:'bell',t:6}; return 'Перемена! Всё быстрее';},
  dark(){G.ev={type:'dark',t:5.5}; return 'Выключили свет';},
  teacher(){G.ev={type:'teacher',t:4.2}; return 'Тихо! Учитель идёт…';},
};
const GIFT={heal:['5','+20 здоровья'],ink:['Ш','Шпаргалка: чернила полные'],fast:['»','Энергетик: скорость']};
function updateEvents(dt){
  if(G.ev&&(G.ev.t-=dt)<=0) G.ev=null;
  if(G.ev?.type==='teacher'&&G.ev.t<3){            // учитель смотрит: кто шевелится — получает двойку
    if(!G.ev.look){G.ev.look=1; note('Учитель смотрит! Замри!');}
    for(const f of F){
      f.caught-=dt;
      const busy=(f.state==='idle'&&f.moving)||ATK[f.state]||f.y<-4;
      if(busy&&f.caught<=0&&f.state!=='ko'){f.caught=1; hit(f,f.x<W/2?-1:1,SPEC.deuce,null); achieve('deuce',f.i);}
    }
  }
  if((G.evT-=dt)<=0){
    const type=pick(Object.keys(EVENTS).filter(e=>e!==G.lastEv));
    G.lastEv=type; G.evT=(10+Math.random()*6)*(world.ev||1); note(EVENTS[type]()); beep(880,.15,'sine');
  }
  items=items.filter(g=>{
    g.y=Math.min(0,g.y+130*dt);
    const f=F.find(f=>Math.abs(f.x-g.x)<28&&g.y>-70&&f.y-TALL<g.y&&f.state!=='ko');
    if(!f) return (g.life-=dt)>0;
    if(g.type==='heal') f.hp=Math.min(100,f.hp+20);
    if(g.type==='ink') f.energy=100;
    if(g.type==='fast') f.fast=7;
    word(GIFT[g.type][1],g.x,GY-90,INK[f.i]); beep(660,.15,'sine');
    return false;
  });
}
function updateShots(dt){
  shots=shots.filter(s=>{
    s.t=(s.t||0)+dt;
    const own=F[s.i], o=F[1-s.i], spec=SPEC[s.kind], dir=Math.sign(s.vx)||1;
    switch(s.kind){
      case 'plane': s.y=s.y0+Math.sin(s.t*14)*14;
      case 'blot':
        s.x+=s.vx*dt;
        if(Math.random()<.4) drops.push({x:s.x,y:GY+s.y,color:INK[s.i],vx:-dir*40,vy:-20,r:1.5+Math.random()*2,life:.3});
        if(Math.abs(s.x-o.x)<20&&inBody(s.y,o)&&o.state!=='ko'){hit(o,dir,spec,own); splash(s.x,GY+s.y,dir,INK[s.i],20); return false;}
        return s.x>-30&&s.x<W+30;
      case 'bomb':
        s.vy+=900*dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
        if(s.y<0&&!(Math.abs(s.x-o.x)<22&&inBody(s.y,o))) return true;
        G.shake=10; splash(s.x,GY+Math.min(0,s.y),0,THEME.pencil,30); beep(70,.3,'sawtooth');
        if(Math.abs(s.x-o.x)<60&&o.y>-80) hit(o,Math.sign(o.x-s.x)||dir,spec,own);
        return false;
      case 'laser': return s.t<.2;
      case 'chalk': return s.t<.35;
      case 'cutlet':
        s.vy+=900*dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
        if(s.y>=-8){s.y=-8; s.n=(s.n||0)+1; s.vy=-420*.85**s.n; beep(300,.05); if(s.n>3) return false;}
        if(Math.abs(s.x-o.x)<22&&inBody(s.y,o)&&o.state!=='ko'){hit(o,dir,spec,own); splash(s.x,GY+s.y,dir,THEME.pencil,14); return false;}
        return s.x>-30&&s.x<W+30;
      case 'bolt':
        if(!s.done&&s.t>=.75){
          s.done=true; G.shake=10; beep(60,.3,'sawtooth');
          if(Math.abs(o.x-s.x)<28) hit(o,Math.sign(o.x-s.x)||1,spec,own);
        }
        return s.t<1;
      case 'wave':
        s.x+=s.vx*dt;
        if(Math.abs(s.x-o.x)<20&&o.y>-18){hit(o,dir,spec,own); return false;}
        return s.t<.65;
      case 'eraser':
        s.x+=s.vx*dt;
        for(const f of F) if(!s.hit[f.i]&&Math.abs(s.x-f.x)<36&&f.y>-26&&f.inv<=0){s.hit[f.i]=1; hit(f,dir,spec,null);}
        return s.x>-70&&s.x<W+70;
    }
  });
}

function word(text,x,y,color){words.push({text,x:clamp(x,60,W-60),y,color,t:0,rot:(Math.random()-.5)*.4});}
function splash(x,y,dir,color,power){
  for(let n=0;n<6+power/2;n++) drops.push({x,y,color,vx:dir*(60+Math.random()*220)+(Math.random()-.5)*(dir?120:500),
    vy:-60-Math.random()*240,r:1.5+Math.random()*3,life:.5+Math.random()*.4});
}
function puff(x,y){
  for(let n=0;n<7;n++) drops.push({x,y,color:THEME.pencil,vx:(Math.random()-.5)*220,vy:-Math.random()*120,r:2+Math.random()*3,life:.3});
}

function update(dt){
  G.clock+=dt;
  G.shake*=Math.exp(-12*dt); G.cheer*=Math.exp(-3*dt);
  if(G.banner) G.banner.t+=dt;
  if(G.note) G.note.t+=dt;
  if(G.stop>0){G.stop-=dt; return;}          // hit-stop: кадр замирает на ударе
  if(G.slow>0){G.slow-=dt; dt*=.3;}          // замедление на нокауте
  if(G.ev?.type==='bell') dt*=1.45;          // «перемена»: всё ускоряется
  G.t+=dt;
  if(G.mode==='intro'&&G.t>1.1){G.mode='fight'; say('Бой!',THEME.red);}
  const live=G.mode==='fight';
  if(live){
    G.time-=dt; updateEvents(dt);
    if(G.time<=0) endRound(F[0].hp===F[1].hp?-1:+(F[1].hp>F[0].hp),'Время!');
  }
  if(G.mode==='over'){
    const w=F[G.winner];
    if(G.finish) updateFinish(G.finish,dt);
    else{
      if(w&&G.t>.8&&w.state==='idle'&&w.y>=0) setState(w,'win');
      if(G.t>2.6) nextRound();
    }
  }
  if(vsBot||G.demo) botUpdate(1,dt);
  if(G.demo) botUpdate(0,dt);
  F.forEach((f,i)=>updateFighter(f,F[1-i],dt,live));
  pending.splice(0).forEach(fn=>fn());

  // бойцы не проходят друг сквозь друга, но перепрыгнуть можно
  const [A,B]=F, d=B.x-A.x, gap=34-Math.abs(d);
  if(gap>0&&Math.abs(A.y-B.y)<60&&A.state!=='ko'&&B.state!=='ko'){
    const push=gap/2*(d>=0?1:-1);
    A.x=clamp(A.x-push,24,W-24); B.x=clamp(B.x+push,24,W-24);
  }
  updateShots(dt);
  drops=drops.filter(p=>{p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; return (p.life-=dt)>0&&p.y<GY+2;});
  words=words.filter(w=>(w.t+=dt)<.75);

  const ease=Math.min(1,dt*22);
  F.forEach((f,i)=>{
    const target=POSES[poseName(f)];
    f.pose.forEach((p,j)=>{p[0]+=(target[j][0]-p[0])*ease; p[1]+=(target[j][1]-p[1])*ease;});
    f.hpShow+=(f.hp-f.hpShow)*Math.min(1,dt*4);
    BTN[i].s.classList.toggle('ready',f.energy>=100||G.finish?.stage==='offer'&&G.finish.w===i);
  });
}

// ---------- рисование ----------
// «Дрожащая линия»: смещения меняются ~8 раз в секунду, как в покадровой анимации от руки
let seed=0, boil=0;
const jit=amp=>{const v=Math.sin(++seed*91.7+boil*47.3)*43758.5; return (v-Math.floor(v)-.5)*2*amp;};
const backOut=t=>1+2.7*(t-1)**3+1.7*(t-1)**2;
const line=(...pts)=>{ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p)); ctx.stroke();};
const dot=(x,y,r)=>{ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();};
function wobblyRect(x,y,w,h){
  const c=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(([a,b])=>[a+jit(1),b+jit(1)]);
  line(...c,c[0]);
}
function hatch(x0,y,w,h,clipX,clipW,color){
  if(clipW<=0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(clipX,y,clipW,h); ctx.clip();
  ctx.beginPath();
  for(let i=-h;i<w;i+=5){ctx.moveTo(x0+i,y+h); ctx.lineTo(x0+i+h,y);}
  ctx.strokeStyle=color; ctx.lineWidth=1.7; ctx.stroke(); ctx.restore();
}

function drawBackdrop(){
  ctx.globalAlpha=.42; ctx.fillStyle=ctx.strokeStyle=THEME.pencil; ctx.lineWidth=1.5;
  ctx.font=`15px ${FONT}`; ctx.textAlign='left';
  ctx.fillText(world.notes[0],W*.08,H*.42);
  ctx.fillText(world.notes[1],W*.7,H*.48);
  if(world.court){                                 // разметка зала
    ctx.beginPath(); ctx.ellipse(W/2,GY,90,12,0,Math.PI,2*Math.PI); ctx.stroke(); line([W/2,GY],[W/2,GY-110]);
    line([W-40,GY-150],[W-40,GY-190],[W-10,GY-190],[W-10,GY-150],[W-40,GY-150]); line([W-44,GY-158],[W-66,GY-158]);
  }
  // зрители-каракули подпрыгивают, когда кто-то пропускает удар
  const n=Math.floor(W/70);
  for(let i=0;i<n;i++){
    const x=(i+.5)*W/n+jit(1), hop=Math.abs(Math.sin(G.clock*14+i*2))*9*G.cheer, y=GY-hop;
    const arm=G.cheer>.25?-9:5;
    ctx.beginPath(); ctx.arc(x,y-24,5,0,7); ctx.stroke();
    line([x,y-19],[x,y-7]); line([x-6,y],[x,y-7],[x+6,y]); line([x-7,y-14+arm],[x,y-16],[x+7,y-14+arm]);
  }
  ctx.globalAlpha=1; ctx.lineWidth=2;
  const ground=[]; for(let x=0;x<=W+80;x+=80) ground.push([x,GY+jit(1.2)]);
  line(...ground);
}
function drawHud(){
  const bw=Math.min(300,W/2-52), by=10, bh=13, ew=bw*.6;
  F.forEach((f,i)=>{
    const x0=i?W/2+38:W/2-38-bw, ink=INK[i], fw=bw*f.hp/100, gw=bw*f.hpShow/100;
    // здоровье убывает к центру экрана: остаток прижат к середине
    ctx.globalAlpha=.3; ctx.fillStyle=ink; ctx.fillRect(i?x0+fw:x0+bw-gw,by,gw-fw,bh); ctx.globalAlpha=1;
    hatch(x0,by,bw,bh,i?x0:x0+bw-fw,fw,ink);
    ctx.strokeStyle=ink; ctx.lineWidth=2; wobblyRect(x0,by,bw,bh);
    // чернила на суперсилу
    const ex=i?x0:x0+bw-ew, e=ew*f.energy/100, full=f.energy>=100;
    ctx.fillStyle=full&&Math.floor(G.clock*6)%2?THEME.pencil:ink; ctx.fillRect(i?ex:ex+ew-e,by+bh+5,e,5);
    ctx.strokeStyle=THEME.pencil; ctx.lineWidth=1.2; wobblyRect(ex,by+bh+5,ew,5);
    // взятые раунды — учительские галочки
    ctx.strokeStyle=THEME.red; ctx.lineWidth=2.2;
    for(let n=0;n<G.wins[i];n++){
      const cx=i?x0+bw-16-n*17:x0+2+n*17, cy=by+bh+5;
      line([cx,cy+4],[cx+4,cy+9],[cx+13,cy-2]);
    }
    ctx.fillStyle=ink; ctx.font=`14px ${FONT}`; ctx.textAlign=i?'right':'left';
    ctx.fillText(f.c.name+(i&&vsBot?' · бот '+LEVELS[botLv].name:'')+(f.hp<=25&&f.hp>0?' в ярости!':''),i?x0+bw:x0,by+bh+27);
  });
  ctx.fillStyle=THEME.pencil; ctx.font=`30px ${FONT}`; ctx.textAlign='center';
  ctx.fillText(Math.ceil(Math.max(0,G.time)),W/2,by+bh+11);
}

// Чем бойцы отличаются на вид: (голова x, y, направление, масштаб, точки позы)
const LOOK={
  vihr(x,y,d,z){for(const s of [-5,0,5]) line([x+s*z,y-10*z],[x+(s-d*3)*z,y-(18-Math.abs(s)*.5)*z]);},
  ninja(x,y,d,z){
    const w=Math.sin(G.clock*8)*3;
    line([x-d*9*z,y-7*z],[x+d*10*z,y-5*z]);
    line([x-d*10*z,y-6*z],[x-d*24*z,y-10*z+w]); line([x-d*10*z,y-5*z],[x-d*22*z,y+z-w]);
  },
  bugai(x,y,d,z){line([x-8*z,y-11*z],[x+8*z,y-11*z]); line([x+d*z,y-7*z],[x+d*9*z,y-4*z]);},
  botan(x,y,d,z){
    for(const s of [6,-3]){ctx.beginPath(); ctx.arc(x+d*s*z,y-z,4*z,0,7); ctx.stroke();}
    line([x-d*7*z,y-z],[x-d*11*z,y-3*z]); line([x-2*z,y-11*z],[x+d*4*z,y-15*z]);
  },
  robot(x,y,d,z){line([x,y-11*z],[x,y-20*z]); dot(x,y-21*z,2.5); line([x+d*2*z,y+5*z],[x+d*8*z,y+5*z]);},
  cat(x,y,d,z,q){
    const w=Math.sin(G.clock*6)*4, [tx,ty]=q[2];
    line([x-9*z,y-6*z],[x-8*z,y-18*z],[x-2*z,y-10*z]); line([x+2*z,y-10*z],[x+8*z,y-18*z],[x+9*z,y-6*z]);
    line([x+d*8*z,y+2*z],[x+d*19*z,y]); line([x+d*8*z,y+4*z],[x+d*19*z,y+6*z]);
    line([tx,ty],[tx-d*14*z,ty-3*z],[tx-d*21*z,ty-16*z+w]);
  },
  mag(x,y,d,z){
    line([x-14*z,y-8*z],[x+14*z,y-8*z]); line([x-9*z,y-9*z],[x-d*3*z,y-33*z],[x+9*z,y-9*z]);
    line([x+d*3*z,y+9*z],[x+d*6*z,y+21*z],[x+d*9*z,y+8*z]);
  },
  pirat(x,y,d,z){
    line([x-15*z,y-7*z],[x,y-18*z],[x+15*z,y-7*z],[x-15*z,y-7*z]);
    line([x-d*10*z,y-5*z],[x+d*10*z,y-z]); dot(x+d*5*z,y-z,4*z);
  },
  otl(x,y,d,z,q){
    ctx.beginPath(); ctx.arc(x,y-2*z,12*z,Math.PI*1.05,Math.PI*1.95); ctx.stroke(); line([x+d*2*z,y-13*z],[x-d*4*z,y-6*z]);
    const [nx,ny]=q[1]; line([nx-6,ny-4],[nx+6,ny+2],[nx+6,ny-4],[nx-6,ny+2],[nx-6,ny-4]);
  },
  povar(x,y,d,z){
    ctx.fillStyle=THEME.paper;
    for(const [ox,oy,r] of [[-7,-17,7],[7,-17,7],[0,-23,8]]){ctx.beginPath(); ctx.arc(x+ox*z,y+oy*z,r*z,0,7); ctx.fill(); ctx.stroke();}
    ctx.fillRect(x-9*z,y-16*z,18*z,6*z); wobblyRect(x-9*z,y-16*z,18*z,6*z); ctx.fillStyle=ctx.strokeStyle;
    line([x+d*z,y+5*z],[x+d*6*z,y+3*z],[x+d*11*z,y+6*z]);
  },
  dir(x,y,d,z,q){
    ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(x-d*3*z,y-5*z,4*z,Math.PI,Math.PI*1.6); ctx.stroke(); ctx.lineWidth=3.4;
    line([x+d*z,y+5*z],[x+d*11*z,y+4*z]); ctx.lineWidth=2.4;
    const [nx,ny]=q[1], [px,py]=q[2], tx=nx+(px-nx)*.45, ty=ny+(py-ny)*.45;
    line([nx-3,ny+2],[tx,ty],[nx+3,ny+2]);
  },
  scrib(x,y,d,z){for(let n=0;n<3;n++){ctx.beginPath(); ctx.arc(x+jit(4),y+jit(4),(11+jit(4))*z,0,7); ctx.stroke();} dot(x-d*2*z,y-2*z,1.8);},
};
function drawFighter(f,gy=GY){
  const fin=G.finish, doom=fin?.stage==='play'&&f.i!==fin.w&&gy===GY?fin:null;
  const fade=doom?.type==='erase'?clamp(1-doom.t/1.4,0,1):1, shrink=doom&&doom.type!=='erase'?clamp(1-doom.t/.6,0,1)*.8+.2:1;
  if(!fade||(doom&&doom.type!=='erase'&&doom.t>=.6)) return;
  const c=f.c, z=c.size, ink=INK[f.i], fy=gy+f.y, d=f.face, rage=f.hp<=25&&f.hp>0;
  const breathe=f.state==='idle'?Math.sin(G.clock*5+f.i*2)*1.2:0, amp=rage?2.6:1.3;
  const q=f.pose.map(([x,y],j)=>[f.x+x*z*d+jit(amp),fy+(y+(j<7?breathe:0))*z+jit(amp)]);
  const [hx,hy]=q[0];
  // тень-штришок
  ctx.strokeStyle=THEME.pencil; ctx.lineWidth=2; ctx.globalAlpha=.5;
  const sw=18*z*(1-Math.min(1,-f.y/140)*.6); line([f.x-sw,gy+4],[f.x+sw,gy+4]); ctx.globalAlpha=1;

  ctx.save();
  if(shrink<1){ctx.translate(f.x,fy-50); ctx.rotate(doom.t*9); ctx.scale(shrink,shrink); ctx.translate(-f.x,-(fy-50));}
  ctx.globalAlpha=fade;
  if(f.state==='ko'&&f.y<0){ctx.translate(f.x,fy-40); ctx.rotate(f.spin); ctx.translate(-f.x,-(fy-40));}
  if(f.inv>0) ctx.globalAlpha=.45*fade;
  ctx.strokeStyle=ink; ctx.fillStyle=THEME.paper;
  ctx.lineWidth=(f.state==='hit'&&f.t<.1?6.5:4)*(c.thick||1);
  line(q[1],q[2]); line(q[1],q[3],q[5]); line(q[1],q[4],q[6]); line(q[2],q[7],q[9]); line(q[2],q[8],q[10]);
  if(c.id==='robot'){ctx.fillRect(hx-10*z,hy-10*z,20*z,20*z); wobblyRect(hx-10*z,hy-10*z,20*z,20*z);}
  else{ctx.beginPath(); ctx.arc(hx,hy,11*z,0,7); ctx.fill(); ctx.stroke();}
  ctx.lineWidth=2.4; ctx.fillStyle=ink;
  LOOK[c.id](hx,hy,d,z,q);
  const ex=hx+d*5*z, ey=hy-z;
  if(f.state==='ko'){line([ex-3,ey-3],[ex+3,ey+3]); line([ex-3,ey+3],[ex+3,ey-3]);}
  else if(c.id!=='pirat') dot(ex,ey,1.8);
  if(rage) for(const s of [-1,1]) line([hx+s*16*z,hy-16*z],[hx+s*21*z,hy-22*z],[hx+s*18*z,hy-25*z],[hx+s*24*z,hy-31*z]);
  if(f.shield>0&&(f.shield>1||Math.floor(G.clock*10)%2)){   // щит-пятёрка
    ctx.strokeStyle=THEME.red; ctx.lineWidth=2.4; ctx.setLineDash([7,5]);
    ctx.beginPath(); ctx.ellipse(f.x,fy-55*z,40*z,68*z,0,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=THEME.red; ctx.font=`22px ${FONT}`; ctx.textAlign='center'; ctx.fillText('5',f.x+d*44*z,fy-110*z);
    ctx.strokeStyle=ink;
  }
  if(f.fast>0) for(const s of [0,1,2]) line([f.x-d*(22+s*7),fy-30-s*22],[f.x-d*(40+s*7),fy-30-s*22]);
  ctx.restore();
}
function portrait(cvs,c,i){
  const main=ctx; ctx=cvs.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cvs.width,cvs.height);
  ctx.lineCap=ctx.lineJoin='round';
  if(c){ctx.setTransform(.76,0,0,.76,0,0); drawFighter({...mkFighter(i),c,face:1,x:66,y:0},156);}
  else{ctx.fillStyle=INK[i]; ctx.font=`90px ${FONT}`; ctx.textAlign='center'; ctx.fillText('?',54,95);}
  ctx=main;
}

function drawShots(){
  for(const s of shots){
    const ink=INK[s.i]??THEME.pencil, y=GY+(s.y||0), dir=Math.sign(s.vx)||s.dir||1;
    ctx.fillStyle=ctx.strokeStyle=ink; ctx.lineWidth=2.4; ctx.globalAlpha=1;
    if(s.kind==='blot') for(let n=0;n<6;n++) dot(s.x+jit(6),y+jit(6),5+jit(2));
    if(s.kind==='plane') line([s.x+dir*16,y],[s.x-dir*12,y-8],[s.x-dir*6,y],[s.x-dir*12,y+7],[s.x+dir*16,y]);
    if(s.kind==='bomb'){dot(s.x,y,8); line([s.x,y-8],[s.x+4,y-15]); ctx.fillStyle=THEME.red; dot(s.x+4+jit(2),y-16+jit(2),2.5);}
    if(s.kind==='laser'){
      ctx.globalAlpha=1-s.t/.2; ctx.lineWidth=7; line([s.x+dir*30,y],[dir>0?W+20:-20,y+jit(2)]);
      ctx.strokeStyle=THEME.paper; ctx.lineWidth=2; line([s.x+dir*30,y],[dir>0?W+20:-20,y]);
    }
    if(s.kind==='bolt'){
      if(!s.done){                                 // метка: сюда ударит молния
        ctx.strokeStyle=THEME.pencil; const r=10+28*(1-s.t/.75);
        ctx.beginPath(); ctx.ellipse(s.x,GY,r,r*.3,0,0,7); ctx.stroke();
        line([s.x-7,GY-5],[s.x+7,GY+5]); line([s.x-7,GY+5],[s.x+7,GY-5]);
      }else{
        ctx.globalAlpha=1-(s.t-.75)/.25; ctx.lineWidth=5;
        const pts=[]; for(let yy=-10;yy<GY;yy+=28) pts.push([s.x+jit(16),yy]);
        line(...pts,[s.x,GY]);
      }
    }
    if(s.kind==='cutlet'){
      ctx.beginPath(); ctx.ellipse(s.x,y,11,7,s.t*8,0,7); ctx.fill();
      ctx.strokeStyle=THEME.paper; ctx.lineWidth=1.5; line([s.x-5,y-2],[s.x+4,y-3]); line([s.x-3,y+2],[s.x+5,y+1]);
    }
    if(s.kind==='chalk'){
      ctx.globalAlpha=1-s.t/.35; ctx.lineWidth=3; ctx.setLineDash([10,6]);
      line([s.x,y],[(s.x+s.x2)/2,y-18+jit(4)],[s.x2,y]); ctx.setLineDash([]);
    }
    if(s.kind==='wave'){ctx.globalAlpha=1-s.t/.65; ctx.lineWidth=3; line([s.x,GY],[s.x+dir*9,GY-12],[s.x,GY-22],[s.x+dir*7,GY-32]);}
    if(s.kind==='eraser'){
      ctx.fillStyle=THEME.margin; ctx.fillRect(s.x-32,GY-26,64,26);
      ctx.strokeStyle=THEME.pencil; ctx.lineWidth=2; wobblyRect(s.x-32,GY-26,64,26);
      ctx.fillStyle=THEME.paper; ctx.font=`13px ${FONT}`; ctx.textAlign='center'; ctx.fillText('ЛАСТИК',s.x,GY-8);
      for(let n=1;n<4;n++) line([s.x-dir*(36+n*9),GY-6-n*5],[s.x-dir*(50+n*9),GY-6-n*5]);
    }
  }
  ctx.globalAlpha=1;
  for(const g of items){                           // бонусы: мигают перед исчезновением
    if(g.life<2&&Math.floor(G.clock*8)%2) continue;
    const y=GY+g.y-18+Math.sin(G.clock*5)*2;
    ctx.fillStyle=THEME.paper; ctx.strokeStyle=THEME.red; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.arc(g.x+jit(.8),y+jit(.8),14,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=THEME.red; ctx.font=`22px ${FONT}`; ctx.textAlign='center'; ctx.fillText(GIFT[g.type][0],g.x,y+7);
  }
}
function drawEffects(){
  for(const p of drops){ctx.fillStyle=p.color; ctx.globalAlpha=Math.min(1,p.life*4); dot(p.x,p.y,p.r);}
  ctx.globalAlpha=1; ctx.textAlign='center'; ctx.lineWidth=5; ctx.strokeStyle=THEME.paper;
  for(const w of words){
    const s=backOut(Math.min(1,w.t/.15));
    ctx.save(); ctx.translate(w.x,w.y-w.t*24); ctx.rotate(w.rot); ctx.scale(s,s);
    ctx.globalAlpha=Math.min(1,(.75-w.t)*5); ctx.font=`${w.text.length>12?18:26}px ${FONT}`;
    ctx.strokeText(w.text,0,0); ctx.fillStyle=w.color; ctx.fillText(w.text,0,0); ctx.restore();
  }
}
// добивание: мир вокруг темнеет, проигравший стирается, летит в мусорку или улетает самолётиком
function drawFinish(){
  const fin=G.finish; if(fin?.stage!=='play') return;
  const v=F[1-fin.w], t=fin.t, cx=v.x, cy=GY-50, away=Math.sign(v.x-F[fin.w].x)||1;
  ctx.globalAlpha=Math.min(.5,t*2); ctx.fillStyle=THEME.night;
  ctx.beginPath(); ctx.rect(-300,-300,W+600,H+600); ctx.moveTo(cx+95,cy); ctx.arc(cx,cy,95,0,7); ctx.fill('evenodd');
  ctx.globalAlpha=1; ctx.lineWidth=2.4;
  if(fin.type==='erase'&&t<1.6){
    const ex=cx+Math.sin(t*16)*38, ey=cy-30+Math.min(1,t/1.4)*55;
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(-.4);
    ctx.fillStyle=THEME.margin; ctx.fillRect(-30,-13,60,26); ctx.strokeStyle=THEME.pencil; wobblyRect(-30,-13,60,26); ctx.restore();
  }
  if(fin.type==='trash'){
    const bx=clamp(cx+away*170,60,W-60);
    ctx.strokeStyle=THEME.pencil; ctx.fillStyle=THEME.paper;
    ctx.beginPath(); ctx.moveTo(bx-26,GY-62); ctx.lineTo(bx+26,GY-62); ctx.lineTo(bx+19,GY); ctx.lineTo(bx-19,GY); ctx.closePath(); ctx.fill(); ctx.stroke();
    for(const k of [-9,0,9]) line([bx+k,GY-54],[bx+k*.8,GY-6]);
    if(t>.6){
      const p=Math.min(1,(t-.6)/.8), x=cx+(bx-cx)*p, y=cy+(GY-70-cy)*p-Math.sin(p*Math.PI)*130;
      if(p<1){ctx.strokeStyle=INK[v.i]; for(let n=0;n<3;n++){ctx.beginPath(); ctx.arc(x+jit(3),y+jit(3),12+jit(3),0,7); ctx.stroke();}}
    }
  }
  if(fin.type==='plane'&&t>.6){
    const p=(t-.6)/1.6, x=cx+away*p*p*W, y=cy-p*230+Math.sin(p*12)*10;
    ctx.strokeStyle=INK[v.i]; line([x+away*22,y],[x-away*16,y-11],[x-away*8,y],[x-away*16,y+9],[x+away*22,y]);
  }
}
function drawTeacher(){
  const e=G.ev; if(e?.type!=='teacher') return;
  const k=Math.min(1,(4.2-e.t)/.5,e.t/.4), x=W+46-k*100, y=128, look=e.t<3;
  ctx.fillStyle=THEME.paper; ctx.strokeStyle=THEME.pencil; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(x+jit(1),y+jit(1),58,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x+10,y-62,18,0,7); ctx.fill(); ctx.stroke();            // пучок
  line([x-56,y-18],[x-20,y-40],[x+30,y-46]);
  const mid=(F[0].x+F[1].x)/2, px=clamp((mid-x)/150,-1,1)*5;
  for(const gx of [-34,-6]){
    ctx.beginPath(); ctx.arc(x+gx,y-6,12,0,7); ctx.stroke();
    if(look){ctx.fillStyle=THEME.pencil; dot(x+gx+px,y-4,3.5);} else line([x+gx-6,y-4],[x+gx+6,y-4]);
  }
  line([x-22,y-6],[x-18,y-6]);
  line([x-30,y+26],[x-12,look?y+24:y+28]);
  if(look){ctx.fillStyle=THEME.red; ctx.font=`40px ${FONT}`; ctx.textAlign='center'; ctx.fillText('!',x-70,y-30);}
}
function drawOverlay(){
  drawTeacher();
  const fin=G.finish;
  ctx.textAlign='center'; ctx.strokeStyle=THEME.paper;
  if(fin?.stage==='offer'&&fin.t>1&&Math.floor(fin.t*4)%2){
    ctx.font=`26px ${FONT}`; ctx.lineWidth=6;
    const t=(G.demo||vsBot&&fin.w)?'ДОБЕЙ!':'ДОБЕЙ! Жми суперсилу';
    ctx.strokeText(t,W/2,H*.36); ctx.fillStyle=THEME.red; ctx.fillText(t,W/2,H*.36);
  }
  if(fin?.stage==='play'){
    const s=backOut(Math.min(1,fin.t/.25));
    ctx.save(); ctx.translate(W/2,H*.4); ctx.rotate(-.04); ctx.scale(s,s);
    ctx.font=`${Math.min(58,H*.25)}px ${FONT}`; ctx.lineWidth=9;
    ctx.strokeText('ДОБИВАНИЕ!',0,0); ctx.fillStyle=THEME.red; ctx.fillText('ДОБИВАНИЕ!',0,0);
    ctx.font=`20px ${FONT}`; ctx.lineWidth=5;
    const sub={trash:'В мусорку!',erase:'Стёрт ластиком',plane:'Улетел самолётиком'}[fin.type];
    ctx.strokeText(sub,0,30); ctx.fillStyle=THEME.pencil; ctx.fillText(sub,0,30); ctx.restore();
  }
  if(G.ev?.type==='dark'){                         // темнота с «фонариками» вокруг бойцов
    ctx.globalAlpha=.95*Math.min(1,G.ev.t*2,(5.5-G.ev.t)*3); ctx.fillStyle=THEME.night;
    ctx.beginPath(); ctx.rect(-30,46,W+60,H);
    for(const f of F){ctx.moveTo(f.x+62,GY+f.y-55); ctx.arc(f.x,GY+f.y-55,62,0,7);}
    ctx.fill('evenodd'); ctx.globalAlpha=1;
  }
  ctx.textAlign='center'; ctx.strokeStyle=THEME.paper;
  const n=G.note;
  if(n&&n.t<2.4){
    ctx.globalAlpha=Math.min(1,n.t*5,(2.4-n.t)*3); ctx.font=`19px ${FONT}`; ctx.lineWidth=5;
    ctx.strokeText(n.text,W/2,66); ctx.fillStyle=THEME.red; ctx.fillText(n.text,W/2,66); ctx.globalAlpha=1;
  }
  const b=G.banner;
  if(b&&b.t<1.1){
    const s=backOut(Math.min(1,b.t/.22));
    ctx.save(); ctx.translate(W/2,H*.6); ctx.rotate(-.05); ctx.scale(s,s);
    ctx.font=`${Math.min(64,H*.28)}px ${FONT}`; ctx.lineWidth=9;
    ctx.strokeText(b.text,0,0); ctx.fillStyle=b.color; ctx.fillText(b.text,0,0); ctx.restore();
  }
}
function draw(now){
  seed=0; boil=Math.floor(now/120);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const k=S*dpr;
  ctx.setTransform(k,0,0,k,(Math.random()-.5)*G.shake*k,(Math.random()-.5)*G.shake*k);
  ctx.lineCap=ctx.lineJoin='round';
  // камера: на нокауте и добивании наезжает на проигравшего
  const fin=G.finish, focus=fin?F[1-fin.w]:G.slow>0?F.find(f=>f.state==='ko'):null;
  G.zoom+=((focus?1.22:1)-G.zoom)*.08; G.zx+=((focus?focus.x:W/2)-G.zx)*.08;
  ctx.save(); ctx.translate(G.zx,GY); ctx.scale(G.zoom,G.zoom); ctx.translate(-G.zx,-GY);
  drawBackdrop(); F.forEach(f=>drawFighter(f)); drawShots(); drawEffects(); drawFinish();
  ctx.restore();
  drawOverlay(); drawHud();
}

// ---------- экран ----------
// Если телефон держат вертикально (или включён запрет поворота), сцена сама поворачивается на 90°
function layout(){
  const cs=getComputedStyle(app), pl=parseFloat(cs.paddingLeft);
  const w=app.clientWidth-pl-parseFloat(cs.paddingRight), h=app.clientHeight, turn=h>w;
  const [sw,sh]=turn?[h,w]:[w,h];
  stage.style.cssText=`left:${turn?pl+w:pl}px;width:${sw}px;height:${sh}px;transform:${turn?'rotate(90deg)':'none'};--b:${Math.min(68,sh*.17,sw*.1)}px`;
  dpr=Math.min(2,devicePixelRatio||1);
  const cw=arena.clientWidth, ch=arena.clientHeight;
  cv.width=cw*dpr; cv.height=ch*dpr;
  S=Math.min(cw/800,ch/225)||1; W=cw/S; H=ch/S; GY=H-14;
  if(G.mode==='menu') F.forEach((f,i)=>f.x=W*(i?.7:.3));
}
new ResizeObserver(layout).observe(app);
layout();
document.fonts?.load('20px Neucha');

$('#mText').textContent=MENU_TEXT; updDiary(); startDemo();

let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  if(!G.paused) update(dt);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
