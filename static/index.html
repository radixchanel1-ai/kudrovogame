<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Захват Кудрово</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#0f1720;--panel:#18222e;--text:#e8eef5;--muted:#8a9bb0;--accent:#f1c40f;--me:#2ecc71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;justify-content:space-around;align-items:center;padding:6px 4px;background:var(--panel)}
.stat{text-align:center}
.stat b{display:block;font-size:16px}
.stat span{color:var(--muted);font-size:10px}
#topBtn{flex:0 0 auto;background:none;font-size:20px;padding:4px 8px}
#map{flex:1;min-height:0;background:#0b1118;position:relative}
#fx{position:absolute;inset:0;pointer-events:none;z-index:650;overflow:hidden}
.fx{position:absolute;left:0;top:0;pointer-events:none;line-height:1;will-change:transform,opacity;filter:drop-shadow(0 2px 2px #000a)}
.ring{position:absolute;left:0;top:0;border-radius:50%;border:4px solid #fff;pointer-events:none;box-sizing:border-box}
.leaflet-interactive.flash{animation:flash .9s ease-out}
@keyframes flash{0%,30%{fill-opacity:1;fill:#fff}100%{}}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 6px #000,0 0 12px #000;white-space:nowrap;pointer-events:none;z-index:651}
.cl{pointer-events:none;width:0!important;height:0!important;overflow:visible}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:var(--lw,100px);font-size:var(--fs,12px);display:var(--ld,block);text-align:center;color:#fff;font-weight:800;line-height:1.1;white-space:normal;overflow-wrap:break-word;hyphens:auto;text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;border:1px solid #0006}
#palette{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
#palette button{height:44px;border-radius:12px;border:3px solid transparent;padding:0}
#palette button.cur{border-color:#fff}
#hint{background:#7a5c00;color:#fff;font-size:13px;padding:7px 12px;text-align:center;display:none}
#info{background:var(--panel);padding:10px 12px;min-height:112px}
.title{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;max-width:50%;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px;margin:4px 0 8px;line-height:1.35}
.sub b{color:var(--text)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:600;color:#fff;background:#2c3a4b;font-family:inherit;min-width:0}
button.primary{background:#27ae60}
button.danger{background:#c0392b}
button.blue{background:#2f6fb0}
button.small{flex:0 0 auto;font-size:12px;padding:8px 10px}
button:disabled{opacity:.4}
#tapRow{display:flex;align-items:center;gap:14px;padding:10px 14px 16px;background:var(--bg)}
#bars{flex:1;display:flex;flex-direction:column;gap:7px}
.bar{font-size:11px;color:var(--muted)}
.track{height:7px;background:#243140;border-radius:4px;overflow:hidden;margin-top:2px}
.fill{height:100%;background:var(--me);width:0;transition:width .1s}
#tapBtn{flex:0 0 108px;height:108px;border-radius:50%;font-size:20px;background:radial-gradient(circle at 35% 30%,#4be38f,#1e8f4e);box-shadow:0 6px 0 #146b39}
#tapBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #146b39}
.float{position:fixed;pointer-events:none;font-weight:800;color:var(--accent);animation:up .9s ease-out forwards;font-size:16px;z-index:1000}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;z-index:1001;max-width:90%;text-align:center;pointer-events:none}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:1002}
.modal .box{background:var(--panel);padding:16px;border-radius:14px;width:86%;max-width:340px}
.modal input{width:100%;padding:10px;border-radius:8px;border:1px solid #33465b;background:#0f1720;color:var(--text);font-size:16px;margin:10px 0;user-select:text;-webkit-user-select:text}
.modal p{color:var(--muted);font-size:14px;line-height:1.4}
#topList{margin:10px 0;padding:0;list-style:none;max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#topList li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;padding:7px 6px;border-radius:9px;font-size:14px}
#topList li.me{background:#2c3a4b;outline:2px solid #2ecc71}
#topList .pl{color:var(--muted);font-weight:700;text-align:right}
#topList .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topList .nm small{display:block;color:var(--muted);font-size:11px}
#topList .pt{font-weight:800;color:var(--accent)}
#myRank{font-size:14px;margin-top:8px}
#rankHelp{color:var(--muted);font-size:11px;line-height:1.35;margin:4px 0 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><b id="sW">0</b><span>🪖 воины</span></div>
    <div class="stat"><b id="sC">0</b><span>💥 пушки</span></div>
    <div class="stat"><b id="sT">0</b><span>🛡 танки</span></div>
    <div class="stat"><b id="sP">0</b><span>⚔️ резерв</span></div>
    <div class="stat"><b id="sM">0</b><span>🗺 террит.</span></div>
    <button id="editBtn" title="Правка границ" style="display:none;opacity:.5;flex:0 0 auto;background:none;font-size:20px;padding:4px 6px">✂️</button>
    <button id="topBtn" title="Рейтинг">🏆</button>
  </header>
  <div id="hint"></div>
  <div id="map"></div>
  <div id="info"><div class="sub">Загрузка…</div></div>
  <div id="tapRow">
    <div id="bars">
      <div class="bar">До воина: <span id="bW"></span><div class="track"><div class="fill" id="fW"></div></div></div>
      <div class="bar">До пушки: <span id="bC"></span><div class="track"><div class="fill" id="fC"></div></div></div>
      <div class="bar">До танка: <span id="bT"></span><div class="track"><div class="fill" id="fT"></div></div></div>
    </div>
    <button id="tapBtn">ТАП</button>
  </div>
</div>
<div id="toast"></div>
<div class="modal" id="nameModal"><div class="box">
  <div class="title">Название территории</div>
  <input id="nameInput" maxlength="30" placeholder="Например: Мой район">
  <div class="btns"><button id="nCancel">Отмена</button><button class="primary" id="nOk">Сохранить</button></div>
</div></div>
<div class="modal" id="confirmModal"><div class="box">
  <div class="title" id="cTitle"></div>
  <p id="cText"></p>
  <div class="btns"><button id="cNo">Отмена</button><button class="primary" id="cYes">Да</button></div>
</div></div>
<div class="modal" id="colorModal"><div class="box">
  <div class="title">🎨 Цвет команды</div>
  <div id="palette"></div>
  <div class="btns"><button id="colClose">Закрыть</button></div>
</div></div>
<div class="modal" id="topModal"><div class="box">
  <div class="title">🏆 Рейтинг команд</div>
  <div id="myRank"></div>
  <ol id="topList"></ol>
  <p id="rankHelp">Очки: 100 за каждую соту + сила армии (защита + резерв) + 1 за каждые 10 тапов.</p>
  <div class="btns"><button id="tClose">Закрыть</button></div>
</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : '';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let GRID = null, ST = null, sel = null, pending = 0, inflight = 0, editMode = false, fitKey = '';
let map, polys = {}, labels = {}, cellById = {};
const FREE = '#5b6b7d', MINE = '#2ecc71', OFF = '#111820';

async function api(path, body = {}) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify({ initData, ...body }) });
  const j = await r.json().catch(() => ({ error: 'Ошибка сети' }));
  if (!r.ok || j.error) throw new Error(j.error || 'Ошибка сервера');
  return j;
}
function haptic(t) { try { tg && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 2600);
}
function floatText(txt, x, y) {
  const f = document.createElement('div'); f.className = 'float'; f.textContent = txt;
  f.style.left = (x - 20) + 'px'; f.style.top = (y - 30) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 900);
}
function askConfirm(title, text, yes) {
  $('cTitle').textContent = title; $('cText').textContent = text;
  $('confirmModal').style.display = 'flex';
  $('cYes').onclick = () => { $('confirmModal').style.display = 'none'; yes(); };
}
$('cNo').onclick = () => $('confirmModal').style.display = 'none';

const pw = o => o.w + o.c * 10 + o.t * 100;
const myTeam = () => ST && ST.team ? ST.team.id : null;
const freeTint = id => `hsl(${(id * 47) % 360} 30% 62%)`;
const ownerColor = c => c.disabled ? OFF : c.owner == null ? freeTint(c.id)
  : (c.color || `hsl(${(Number(c.owner) * 137) % 360} 70% 50%)`);
const cellName = c => c.name || 'Территория без названия';
const myCells = () => myTeam() == null ? [] : ST.cells.filter(c => c.owner === myTeam());
const army = c => `${c.w} 🪖 · ${c.c} 💥 · ${c.t} 🛡`;

/* общий резерв команды с учётом тапов, ещё не отправленных на сервер */
function reserve() {
  const m = ST.team || { taps: 0, rw: 0, rc: 0, rt: 0 }, T = m.taps + pending + inflight;
  const d = n => Math.floor(T / n) - Math.floor(m.taps / n);
  const r = { T, w: m.rw + d(10), c: m.rc + d(100), t: m.rt + d(1000) };
  r.power = pw(r); return r;
}

/* ---------- Отрисовка ---------- */
function renderMap() {
  for (const c of ST.cells) {
    const p = polys[c.id]; if (!p) continue;
    const show = !c.disabled || editMode;
    if (show && !map.hasLayer(p)) { p.addTo(map); labels[c.id].addTo(map); }
    if (!show) { if (map.hasLayer(p)) { p.remove(); labels[c.id].remove(); } continue; }
    const mine = c.owner != null && c.owner === myTeam();
    p.setStyle({ fillColor: ownerColor(c),
                 fillOpacity: c.disabled ? 0.35 : c.owner == null ? 0.22 : 0.6,
                 color: sel === c.id ? '#f1c40f' : mine ? '#ffffff' : '#1b2633',
                 weight: sel === c.id ? 4 : mine ? 2.5 : 1.5 });
    const el = labels[c.id].getElement();
    if (el) el.innerHTML = c.disabled || !(c.name || c.home) ? '' : `<div class="lb">${c.home ? '🏠 ' : ''}${esc(c.name || '')}</div>`;
  }
}
function renderHUD() {
  const r = reserve();
  $('sW').textContent = r.w; $('sC').textContent = r.c; $('sT').textContent = r.t;
  $('sP').textContent = r.power; $('sM').textContent = myCells().length;
  for (const [k, n] of [['W', 10], ['C', 100], ['T', 1000]]) {
    $('b' + k).textContent = (n - r.T % n) + ' тап.';
    $('f' + k).style.width = (r.T % n) / n * 100 + '%';
  }
  const h = $('hint');
  if (!ST.team) {
    h.style.display = 'block';
    h.textContent = ST.me.taps > 0
      ? 'Твоя команда потеряла все территории. Выбери территорию заново.'
      : '👆 Выбери территорию: серая сота — основать свою, цветная — вступить в команду';
  } else h.style.display = 'none';
}
function adjacentToMe(id) {
  return GRID.neighbors[id].some(n => cellById[n] && cellById[n].owner === myTeam());
}
function renderInfo() {
  const box = $('info');
  if (sel == null) {
    const t = ST.team;
    box.innerHTML = t
      ? `<div class="title"><span><span class="sw" style="background:${t.color}"></span>${esc(t.name)}</span><span class="tag" style="background:#2c3a4b">👥 ${t.members}${t.leader ? ' · 👑 ты лидер' : ''}</span></div><div class="sub">Тапы всей команды складываются: 10 — воин, 100 — пушка, 1000 — танк. Выбери соту на карте: свою — чтобы отправить резерв в защиту, соседнюю — чтобы атаковать.</div>` + (t.leader ? '<div class="btns"><button class="small" id="colBtn">🎨 Цвет команды</button></div>' : '')
      : '<div class="title">Битва за Кудрово</div><div class="sub">Выбери территорию на карте. Бледная сота — основать свою, яркая — вступить в команду. Тапы команды складываются, так быстрее копятся пушки и танки.</div>';
    if ($('colBtn')) $('colBtn').onclick = openColors;
    return;
  }
  const c = cellById[sel], r = reserve(), own = c.owner != null && c.owner === myTeam(), hasLand = !!ST.team;
  const ownerTxt = c.disabled ? 'Не в игре' : c.owner == null ? 'Свободная'
    : (own ? 'Ваша · ' : '') + (c.ownerName || 'Команда') + ' · 👥' + c.members;
  let sub;
  if (c.disabled) sub = 'Эта территория не входит в Кудрово.';
  else sub = `Защита: <b>${pw(c)}</b> (${army(c)})` + (hasLand ? `<br>Резерв команды: <b>${r.power}</b>` : '');
  box.innerHTML = `<div class="title"><span>${c.home ? '🏠 ' : ''}${esc(cellName(c))}</span><span class="tag" style="background:${ownerColor(c)}">${esc(ownerTxt)}</span></div>
    <div class="sub">${sub}</div><div class="btns" id="iBtns"></div>`;
  const btns = $('iBtns');
  const mk = (txt, cls, fn, dis) => { const b = document.createElement('button'); b.textContent = txt; if (cls) b.className = cls; b.disabled = !!dis; b.onclick = fn; btns.appendChild(b); };

  if (!c.disabled) {
    if (!hasLand) {
      if (c.owner == null) mk('🏠 Основать здесь территорию', 'primary', () => askConfirm(
        'Основать «' + cellName(c) + '»?', 'Это будет твоя территория. Друзья смогут вступить к тебе. Сменить потом нельзя.',
        () => act('/api/choose', { cell: c.id })));
      else mk('🤝 Вступить в «' + c.ownerName + '»', 'primary', () => askConfirm(
        'Вступить в «' + c.ownerName + '»?', 'Ваши тапы будут складываться в общую армию. Сменить команду потом нельзя.',
        () => act('/api/choose', { cell: c.id })));
    } else if (own) {
      mk('🛡 В защиту (+' + r.power + ')', 'blue', () => act('/api/defend', { cell: c.id }), r.power === 0);
    } else {
      const ok = adjacentToMe(c.id);
      mk(ok ? `⚔️ В атаку (${r.power} против ${pw(c)})` : 'Нет общей границы с тобой',
         r.power > pw(c) ? 'primary' : 'danger', () => act('/api/attack', { cell: c.id }), !ok || r.power === 0);
    }
  }
  if (ST.admin) {
    mk('✏️', 'small', () => openName(c.id));
    mk(c.disabled ? '✅ Вернуть в игру' : '🚫 Не Кудрово', 'small', () => act('/api/toggle', { cell: c.id }));
  }
}
function fitMap() {
  const active = ST.cells.filter(c => !c.disabled || editMode);
  const key = active.map(c => c.id).join(',');
  if (key === fitKey || !active.length) return;
  const first = fitKey === ''; fitKey = key;
  const b = L.latLngBounds([]);
  for (const c of active) for (const pt of GRID.cells[c.id].poly) b.extend(pt);
  map.setMaxBounds(null);
  map.setMinZoom(Math.max(10, map.getBoundsZoom(b) - 1));
  map.setMaxBounds(b.pad(0.8));
  if (first) map.fitBounds(b, { padding: [6, 6] });
}
function renderAll() {
  cellById = {}; for (const c of ST.cells) cellById[c.id] = c;
  if (sel != null && cellById[sel] && cellById[sel].disabled && !editMode) sel = null;
  $('editBtn').style.display = ST.admin ? 'block' : 'none';
  fitMap(); renderMap(); renderHUD(); renderInfo();
}
$('editBtn').onclick = () => {
  editMode = !editMode;
  $('editBtn').style.opacity = editMode ? 1 : 0.5;
  toast(editMode ? '✂️ Правка границ: скрытые соты видны, их можно вернуть' : 'Правка границ выключена');
  renderAll();
};

/* ---------- Сеть ---------- */
/* ---------- Анимации ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fxLayer() {
  let l = $('fx');
  if (!l) { l = document.createElement('div'); l.id = 'fx'; $('map').appendChild(l); }
  return l;
}
const pt = id => map.latLngToContainerPoint(GRID.cells[id].center);
function hexPx() {
  const p = GRID.cells[0].poly;
  return map.latLngToContainerPoint(p[1]).distanceTo(map.latLngToContainerPoint(p[4]));
}
const tr = (x, y, size, extra) => `translate(${x - size / 2}px,${y - size / 2}px)` + (extra ? ' ' + extra : '');
function sprite(txt, x, y, size) {
  const e = document.createElement('div'); e.className = 'fx'; e.textContent = txt;
  e.style.fontSize = size + 'px'; e.style.transform = tr(x, y, size);
  fxLayer().appendChild(e); return e;
}
function haptN(t) { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} }
function flashCell(id) {
  const el = polys[id] && polys[id].getElement && polys[id].getElement();
  if (!el) return;
  el.classList.remove('flash'); void el.getBBox(); el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 950);
}
function ring(id, color) {
  const c = pt(id), h = hexPx();
  const r = document.createElement('div'); r.className = 'ring';
  r.style.borderColor = color || '#fff'; r.style.width = r.style.height = h + 'px';
  fxLayer().appendChild(r);
  r.animate([{ transform: tr(c.x, c.y, h, 'scale(.2)'), opacity: 1 },
             { transform: tr(c.x, c.y, h, 'scale(1.6)'), opacity: 0 }],
            { duration: 700, easing: 'ease-out' }).onfinish = () => r.remove();
}
function banner(text, color) {
  const b = document.createElement('div'); b.className = 'banner'; b.textContent = text;
  if (color) b.style.color = color;
  $('map').appendChild(b);
  b.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
             { transform: 'translate(-50%,-50%) scale(1.15)', opacity: 1, offset: .25 },
             { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .75 },
             { transform: 'translate(-50%,-70%) scale(1)', opacity: 0 }],
            { duration: 1500, easing: 'ease-out' }).onfinish = () => b.remove();
}
/* армия летит дугой из своей соседней соты в цель */
async function animFlight(fromId, toId, army) {
  const a = pt(fromId), b = pt(toId), h = hexPx();
  const size = Math.max(16, Math.min(34, h / 3));
  const icons = [];
  for (let i = 0; i < Math.min(army.t, 2); i++) icons.push('🛡');
  for (let i = 0; i < Math.min(army.c, 3); i++) icons.push('💥');
  for (let i = 0; i < Math.min(army.w, 7 - icons.length); i++) icons.push('🪖');
  if (!icons.length) icons.push('🪖');
  const lift = Math.max(40, a.distanceTo(b) * 0.6);
  const jobs = icons.map((ic, i) => {
    const jx = (Math.random() - .5) * h * .5, jy = (Math.random() - .5) * h * .4;
    const e = sprite(ic, a.x, a.y, size);
    const mx = (a.x + b.x) / 2 + jx, my = Math.min(a.y, b.y) - lift + jy;
    const rot = b.x > a.x ? 15 : -15;
    const an = e.animate([
      { transform: tr(a.x + jx * .3, a.y + jy * .3, size, 'scale(.4)'), opacity: 0 },
      { transform: tr(a.x + jx * .3, a.y + jy * .3, size, 'scale(1)'), opacity: 1, offset: .12 },
      { transform: tr(mx, my, size, `scale(1.25) rotate(${rot}deg)`), opacity: 1, offset: .55 },
      { transform: tr(b.x + jx * .4, b.y + jy * .4, size, 'scale(.9)'), opacity: 1 }
    ], { duration: 850, delay: i * 70, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
    return new Promise(res => { an.onfinish = () => res(e); });
  });
  return Promise.all(jobs);
}
function animCapture(id, sprites, color) {
  sprites.forEach(e => e.remove());
  const c = pt(id), h = hexPx(), size = Math.max(16, Math.min(30, h / 3.2));
  flashCell(id); ring(id, color); setTimeout(() => ring(id, '#ffd84a'), 150);
  for (let i = 0; i < 10; i++) {
    const ang = Math.PI * 2 * i / 10, d = h * (.55 + Math.random() * .35);
    const e = sprite(i % 2 ? '🔥' : '✨', c.x, c.y, size * .8);
    e.animate([{ transform: tr(c.x, c.y, size * .8, 'scale(.3)'), opacity: 1 },
               { transform: tr(c.x + Math.cos(ang) * d, c.y + Math.sin(ang) * d, size * .8, 'scale(1)'), opacity: 0 }],
              { duration: 700, easing: 'ease-out' }).onfinish = () => e.remove();
  }
  const fs = size * 1.6, fy = c.y - h * .1;
  const f = sprite('🚩', c.x, fy, fs);
  f.animate([{ transform: tr(c.x, fy, fs, 'scale(0)') },
             { transform: tr(c.x, fy, fs, 'scale(1.3)'), offset: .3 },
             { transform: tr(c.x, fy, fs, 'scale(1)'), opacity: 1, offset: .8 },
             { transform: tr(c.x, fy, fs, 'scale(1)'), opacity: 0 }],
            { duration: 1400, easing: 'ease-out' }).onfinish = () => f.remove();
}
function animRepelled(id, sprites) {
  const c = pt(id), h = hexPx(), size = Math.max(20, Math.min(40, h / 2.5));
  const sh = sprite('🛡', c.x, c.y, size);
  sh.animate([{ transform: tr(c.x, c.y, size, 'scale(.3)'), opacity: 0 },
              { transform: tr(c.x, c.y, size, 'scale(1.4)'), opacity: 1, offset: .3 },
              { transform: tr(c.x, c.y, size, 'scale(1)'), opacity: 1, offset: .7 },
              { transform: tr(c.x, c.y, size, 'scale(1)'), opacity: 0 }],
             { duration: 1100 }).onfinish = () => sh.remove();
  ring(id, '#e74c3c');
  sprites.forEach((e, i) => {
    const dx = (Math.random() - .5) * h, dy = h * (.6 + Math.random() * .4);
    e.animate([{ transform: getComputedStyle(e).transform, opacity: 1 },
               { transform: `translate(${c.x + dx}px,${c.y + dy}px) rotate(${(Math.random() - .5) * 360}deg) scale(.6)`, opacity: 0 }],
              { duration: 650, delay: i * 30, easing: 'ease-in', fill: 'forwards' }).onfinish = () => e.remove();
  });
}
async function animDefend(id, army) {
  const c = pt(id), h = hexPx(), size = Math.max(16, Math.min(30, h / 3.2));
  const n = Math.min(6, Math.max(1, army.w + army.c + army.t));
  for (let i = 0; i < n; i++) {
    const x = c.x + (Math.random() - .5) * h * .5, y = c.y + (Math.random() - .5) * h * .3;
    const e = sprite(army.t > i ? '🛡' : army.c > i ? '💥' : '🪖', x, y, size);
    e.animate([{ transform: tr(x, y - h, size), opacity: 0 },
               { transform: tr(x, y, size), opacity: 1, offset: .5 },
               { transform: tr(x, y - 6, size), opacity: 1, offset: .7 },
               { transform: tr(x, y, size), opacity: 0 }],
              { duration: 1100, delay: i * 80, easing: 'ease-out' }).onfinish = () => e.remove();
  }
  await sleep(500); ring(id, '#3498db'); flashCell(id);
}
/* чужие захваты, замеченные при обновлении карты */
let prevOwners = null;
const skipFx = new Set();
function animForeignChanges(newCells) {
  if (prevOwners && map) {
    let n = 0;
    for (const c of newCells) {
      const was = prevOwners[c.id];
      if (was === undefined || was === c.owner || c.owner == null || c.disabled || skipFx.has(c.id) || n >= 5) continue;
      n++;
      setTimeout(() => {
        flashCell(c.id); ring(c.id, c.color || '#fff');
        const p = pt(c.id), s = Math.max(16, Math.min(28, hexPx() / 3.2));
        const e = sprite('⚔️', p.x, p.y, s);
        e.animate([{ opacity: 0, transform: tr(p.x, p.y, s, 'scale(.3)') },
                   { opacity: 1, transform: tr(p.x, p.y, s, 'scale(1.3)'), offset: .3 },
                   { opacity: 0, transform: tr(p.x, p.y, s, 'scale(1)') }], { duration: 1200 }).onfinish = () => e.remove();
        if (was != null && was === myTeam()) { toast('⚠️ «' + (c.ownerName || 'Враг') + '» захватила вашу соту!'); haptN('warning'); }
      }, n * 250);
    }
  }
  skipFx.clear();
  prevOwners = {}; for (const c of newCells) prevOwners[c.id] = c.owner;
}

async function refresh() {
  try { const s = await api('/api/state'); animForeignChanges(s.cells); ST = s; renderAll(); }
  catch (e) { toast(e.message); }
}
async function flush() {
  if (!pending || inflight) return;
  inflight = pending; pending = 0;
  try { const r = await api('/api/tap', { n: inflight }); ST.team = Object.assign(ST.team || {}, r.team); }
  catch (e) { toast(e.message); }
  inflight = 0; renderHUD(); if (sel != null) renderInfo();
}
let busy = false;
async function act(path, body) {
  if (busy) return; busy = true;
  try {
    while (inflight) await sleep(100);
    await flush();
    const id = body.cell, army = reserve();
    let flight = null;
    if (path === '/api/attack' && id != null) {
      const from = GRID.neighbors[id].filter(n => cellById[n] && cellById[n].owner === myTeam())
        .sort((x, y) => pt(x).distanceTo(pt(id)) - pt(y).distanceTo(pt(id)))[0];
      if (from != null) { haptic('medium'); flight = animFlight(from, id, army); }
    }
    if (path === '/api/defend' && id != null) animDefend(id, army);
    let r;
    try { r = await api(path, body); }
    catch (e) { if (flight) (await flight).forEach(el => el.remove()); toast(e.message); return; }
    if (flight) {
      const sprites = await flight;
      const tc = r.state.cells.find(c => c.id === id);
      const won = r.state.team && tc && tc.owner === r.state.team.id;
      if (won) { animCapture(id, sprites, r.state.team.color); banner('ЗАХВАЧЕНО!', '#ffd84a'); haptN('success'); }
      else { animRepelled(id, sprites); banner('ОТБИТО', '#ff6b5b'); haptN('error'); }
      await sleep(250);
    } else haptic('heavy');
    if (id != null) skipFx.add(id);
    animForeignChanges(r.state.cells);
    ST = r.state; renderAll();
    if (r.msg) toast(r.msg);
  } finally { busy = false; }
}

/* ---------- Действия ---------- */
$('tapBtn').addEventListener('pointerdown', e => {
  if (!ST) return;
  if (!ST.team) { toast('Сначала выбери территорию на карте'); return; }
  const before = reserve();
  pending++;
  const a = reserve();
  floatText('+1', e.clientX, e.clientY);
  if (a.w > before.w) floatText('🪖 +воин', e.clientX, e.clientY - 20);
  if (a.c > before.c) { toast('💥 Новая пушка! (+10 силы)'); haptic('medium'); }
  if (a.t > before.t) { toast('🛡 Новый танк! (+100 силы)'); haptic('heavy'); }
  haptic('light'); renderHUD(); if (sel != null) renderInfo();
});

function openColors() {
  const pal = $('palette'); pal.innerHTML = '';
  for (const col of ST.colors) {
    const b = document.createElement('button'); b.style.background = col;
    if (ST.team && ST.team.color === col) b.className = 'cur';
    b.onclick = () => { $('colorModal').style.display = 'none'; act('/api/color', { color: col }); };
    pal.appendChild(b);
  }
  $('colorModal').style.display = 'flex';
}
$('colClose').onclick = () => $('colorModal').style.display = 'none';

let nameIdx = null;
function openName(id) {
  nameIdx = id; $('nameInput').value = cellById[id].name || '';
  $('nameModal').style.display = 'flex'; setTimeout(() => $('nameInput').focus(), 50);
}
$('nCancel').onclick = () => $('nameModal').style.display = 'none';
$('nOk').onclick = () => {
  $('nameModal').style.display = 'none';
  act('/api/name', { cell: nameIdx, name: $('nameInput').value });
};
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('nOk').click(); });

$('topBtn').onclick = () => {
  if (!ST) return;
  const myId = myTeam();
  $('myRank').innerHTML = ST.rank
    ? `Ваша команда: <b>${ST.rank} место</b> из ${ST.top.length}`
    : 'Ты пока не в команде — выбери территорию на карте';
  $('topList').innerHTML = ST.top.length
    ? ST.top.map((r, i) => `<li class="${r.id === myId ? 'me' : ''}"><span class="pl">${i < 3 ? ['🥇','🥈','🥉'][i] : i + 1}</span>
        <span class="nm"><span class="sw" style="background:${r.color}"></span>${esc(r.name)}<small>${r.n} 🗺 · ${r.members} 👥 · ⚔️ ${r.power}</small></span>
        <span class="pt">${r.points}</span></li>`).join('')
    : '<li>Пока нет ни одной команды</li>';
  $('topModal').style.display = 'flex';
  const meEl = $('topList').querySelector('.me');
  if (meEl) meEl.scrollIntoView({ block: 'center' });
};
$('tClose').onclick = () => $('topModal').style.display = 'none';

/* ---------- Старт ---------- */
(async function init() {
  GRID = await (await fetch('/api/grid')).json();
  map = L.map('map', { zoomControl: false, maxBoundsViscosity: 0.6 }).fitBounds(GRID.bounds);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
              { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
  for (const c of GRID.cells) {
    const p = L.polygon(c.poly, { fillColor: FREE, fillOpacity: 0.25, color: '#1b2633', weight: 1.5 });
    p.on('click', () => {
      if (!ST) return;
      const cell = cellById[c.id];
      if (cell && cell.disabled && !editMode) return;
      sel = c.id; haptic(); renderAll();
    });
    polys[c.id] = p;
    labels[c.id] = L.marker(c.center, { interactive: false,
      icon: L.divIcon({ className: 'cl', html: '', iconSize: [0, 0], iconAnchor: [0, 0] }) });
  }
  // подписи растут и уменьшаются вместе с сотами, чтобы не налезать друг на друга
  const scaleLabels = () => {
    const pts = GRID.cells[0].poly;
    const a = map.latLngToContainerPoint(pts[1]), b = map.latLngToContainerPoint(pts[4]);
    const hexH = a.distanceTo(b);               // высота соты в пикселях
    const hexW = hexH * 0.866;
    const el = $('map').style;
    el.setProperty('--lw', Math.round(hexW * 0.92) + 'px');
    el.setProperty('--fs', Math.max(6, Math.min(18, hexW / 7.5)).toFixed(1) + 'px');
    el.setProperty('--ld', hexW < 34 ? 'none' : 'block');
  };
  map.on('zoom zoomend viewreset', scaleLabels); scaleLabels();
  if (!initData) { $('info').innerHTML = '<div class="sub">Открой игру через бота в Telegram.</div>'; return; }
  await refresh();
  // тапы отправляются пачкой раз в 2 секунды, карта обновляется раз в 5 секунд,
  // а когда игра свёрнута — не обновляется вообще (экономим сервер)
  setInterval(flush, 2000);
  setInterval(() => { if (!inflight && !document.hidden) refresh(); }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); else flush(); });
})();
</script>
